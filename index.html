<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devlet Yönetim Paneli</title>
<style>
:root{
 --bg:#0b1220;--panel:#151f31;--panel2:#1b2940;--line:#30415c;--text:#edf3ff;--muted:#9aabc4;
 --green:#16c79a;--blue:#3d82f6;--red:#f0444c;--gold:#ffb000;--purple:#a970ff;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.container{max-width:1200px;margin:auto;padding:20px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#101a2b;border:1px solid var(--line);padding:16px 18px;border-radius:12px;position:sticky;top:10px;z-index:10}
h1,h2,h3{margin:0 0 10px}.brand{font-size:22px;font-weight:800}.sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:8px;color:#fff;background:#33445e}.btn.green{background:var(--green);color:#061b15}.btn.blue{background:var(--blue)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#221600}.btn.small{padding:7px 10px;font-size:13px}
.screen{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.state-card{border:3px solid var(--accent,#30415c);min-height:220px}
.state-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.badge{border:1px solid var(--accent,#30415c);padding:7px 10px;border-radius:6px;color:var(--accent,#fff);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#dfe8f8}.money{color:var(--green);font-weight:700}.muted{color:var(--muted)}.section-title{margin:24px 0 12px;color:var(--gold);font-size:19px}
.notice{padding:12px;border-radius:9px;background:#211b1d;border:1px solid #71343b;color:#ffb6bc;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}
.kpi{font-size:22px;font-weight:800}.kpi small{font-size:12px;color:var(--muted);font-weight:400}
.progress{height:9px;background:#2d3b52;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green)}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0e1726;color:var(--text);outline:none}textarea{min-height:80px;resize:vertical}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.tabs{display:flex;gap:8px;margin-bottom:14px}.hidden{display:none!important}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:min(430px,100%);background:var(--panel);padding:24px;border-radius:16px;border:1px solid var(--line)}.error{color:#ff8188;font-size:13px;margin-top:10px;white-space:pre-wrap}.success{color:#54e2b4;font-size:13px;margin-top:10px;white-space:pre-wrap}
@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{position:static}.container{padding:12px}.brand{font-size:18px}}
</style>
</head>
<body>
<div id="auth" class="auth">
 <div class="authbox">
  <h1>⚔️ Devlet Yönetim Paneli</h1><p class="sub">Supabase hesabınla giriş yap.</p>
  <div class="tabs"><button id="loginTab" class="btn blue small">Giriş Yap</button><button id="signupTab" class="btn small">Kayıt Ol</button></div>
  <label>E-posta</label><input id="email" type="email" autocomplete="email">
  <label>Şifre</label><input id="password" type="password" autocomplete="current-password">
  <button id="authBtn" class="btn green" style="width:100%;margin-top:14px">Giriş Yap</button>
  <div id="authMsg"></div>
 </div>
</div>

<div id="app" class="hidden">
<div class="container">
<header class="top">
 <div><div class="brand">⚔️ DEVLET YÖNETİM PANELİ</div><div id="syncText" class="sub">Supabase'e bağlanılıyor…</div></div>
 <div class="actions" id="topActions"></div>
</header>
<div id="home" class="screen">
 <div class="section-title">DEVLETLER</div>
 <div id="stateGrid" class="grid"></div>
</div>
<div id="detail" class="screen hidden"></div>
</div></div>

<div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ---------- YETKİLENDİRME AYARLARI ----------
const SUPER_ADMINS = ["osman.baris.sarikaya1@gmail.com"]; 
let currentUserEmail = null;
let isAdmin = false;
// --------------------------------------------

const SUPABASE_URL=String(window.SUPABASE_URL||"").trim();
const SUPABASE_KEY=String(window.SUPABASE_KEY||"").trim();
let sb=null;
let db={states:[],settings:null,transfers:[]}, currentId=null, authMode="login", saveTimer=null;

function initSupabase(){
 if(!window.supabase || typeof window.supabase.createClient!=="function") throw new Error("Supabase JavaScript kütüphanesi yüklenemedi.");
 if(!SUPABASE_URL || !SUPABASE_KEY) throw new Error("config.js içindeki Supabase URL veya publishable key boş.");
 if(!SUPABASE_KEY.startsWith("sb_publishable_")) throw new Error("config.js içindeki anahtar sb_publishable_ ile başlamıyor.");
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}

const defaultSettings={
 prices:{piyade:10,suvari:50,nisanci:20,kucuk_top:3000,orta_top:6000,buyuk_top:10000,kucuk_gemi:15000,orta_gemi:30000,buyuk_gemi:60000,kucuk_liman:100000,orta_liman:180000,buyuk_liman:300000,kucuk_ocak:80000,orta_ocak:150000,buyuk_ocak:250000,okul:120000},
 capacity:{kucuk_liman:5,orta_liman:7,buyuk_liman:10,kucuk_ocak:10,orta_ocak:20,buyuk_ocak:35},
 upkeep:{piyade:1,suvari:5,nisanci:2,kucuk_top:250,orta_top:450,buyuk_top:800,kucuk_gemi:1200,orta_gemi:2200,buyuk_gemi:4000},
 schoolEducation:2, educationTaxBonus:0.75, happinessEligibleBonus:0.20,
 customItems: [] 
};

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return Number(n||0).toLocaleString("tr-TR")+" TL"}
function num(n){return Number(n||0).toLocaleString("tr-TR")}
function getState(id){return db.states.find(s=>s.id===id)}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function modal(html){document.getElementById("modalContent").innerHTML=html;document.getElementById("modal").classList.add("show")}
function toast(msg,ok=false){document.getElementById("syncText").textContent=(ok?"✓ ":"⚠ ")+msg}

async function init(){
 try{
  initSupabase();
  const {data:{session},error}=await sb.auth.getSession();
  if(error) throw error;
  sb.auth.onAuthStateChange((_e,s)=>{if(s) showApp(s); else showAuth()});
  if(session) showApp(session); else showAuth();
 }catch(e){
  const msg=document.getElementById("authMsg");
  if(msg){msg.className="error";msg.textContent="❌ Supabase: "+(e.message||e);}
  console.error(e);
 }
}
function showAuth(){document.getElementById("app").classList.add("hidden");document.getElementById("auth").classList.remove("hidden")}

async function showApp(session){
 currentUserEmail = (session?.user?.email || "").trim().toLowerCase();
 isAdmin = SUPER_ADMINS.map(m => m.trim().toLowerCase()).includes(currentUserEmail);
 
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 
 const actionsDiv = document.getElementById("topActions");
 if(isAdmin){
    actionsDiv.innerHTML = `<button class="btn green" onclick="openStateForm()">＋ Devlet Ekle</button><button class="btn blue" onclick="openAdmin()">⚙ Admin</button><button class="btn" onclick="logout()">Çıkış</button>`;
 } else {
    actionsDiv.innerHTML = `<span style="color:var(--muted); font-size:12px; margin-right:10px;">👤 ${esc(currentUserEmail)}</span><button class="btn" onclick="logout()">Çıkış</button>`;
 }

 await loadDB();
 renderHome();
}

function setAuthMode(m){authMode=m;document.getElementById("authBtn").textContent=m==="login"?"Giriş Yap":"Kayıt Ol";document.getElementById("loginTab").className="btn "+(m==="login"?"blue":"")+" small";document.getElementById("signupTab").className="btn "+(m==="signup"?"blue":"")+" small"}
document.getElementById("loginTab").onclick=()=>setAuthMode("login");document.getElementById("signupTab").onclick=()=>setAuthMode("signup");
document.getElementById("authBtn").onclick=async()=>{
 const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
 const msg=document.getElementById("authMsg");msg.className="";msg.textContent="İşleniyor…";
 try{
  if(authMode==="signup"){const r=await sb.auth.signUp({email,password});if(r.error)throw r.error;msg.className="success";msg.textContent=r.data.session?"Hesap oluşturuldu.":"Hesap oluşturuldu. E-posta doğrulaması açıksa gelen kutunu kontrol et."}
  else {const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error}
 }catch(e){msg.className="error";msg.textContent="❌ "+(e.message||e)}
};
async function logout(){await sb.auth.signOut()}

async function loadDB(){
 if(!sb){toast("Supabase bağlantısı kurulamadı.");return}
 toast("Veriler yükleniyor…");
 const {data,error}=await sb.from("game_state").select("data").eq("id",1).maybeSingle();
 if(error){toast("Supabase okuma hatası: "+error.message);return}
 if(data?.data){
    db=data.data;
    db.settings={...defaultSettings,...(db.settings||{})};
    db.settings.prices={...defaultSettings.prices,...(db.settings?.prices||{})};
    db.settings.capacity={...defaultSettings.capacity,...(db.settings?.capacity||{})};
    db.settings.upkeep={...defaultSettings.upkeep,...(db.settings?.upkeep||{})};
    db.settings.customItems = db.settings.customItems || [];
 }
 else {db={states:[],settings:structuredClone(defaultSettings),transfers:[]};await saveDB()}
 toast("Çevrimiçi ve otomatik kayıt açık",true);
}
async function saveDB(){
 if(!sb){toast("Supabase bağlantısı kurulamadı.");return false}
 const {error}=await sb.from("game_state").upsert({id:1,data:db,updated_at:new Date().toISOString()});
 if(error){toast("Kayıt hatası: "+error.message);return false} toast("Kaydedildi • "+new Date().toLocaleTimeString("tr-TR"),true);return true
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveDB,250)}

function renderHome(){
 currentId=null;document.getElementById("detail").classList.add("hidden");document.getElementById("home").classList.remove("hidden");
 const box=document.getElementById("stateGrid");
 
 // KESİN GÜVENLİK: Adminse tüm devletler, değilse sadece kendisine atanmış devletleri listele
 const visibleStates = isAdmin ? db.states : db.states.filter(s => s.ownerEmail === currentUserEmail);
 
 if(!visibleStates.length){
    box.innerHTML=`<div class="empty">Henüz görebileceğiniz bir devlet yok.<br><br>${isAdmin ? '<button class="btn green" onclick="openStateForm()">＋ İlk Devleti Ekle</button>' : '<span style="color:var(--muted)">Adminin size bir devlet atamasını bekleyin.</span>'}</div>`;
    return
 }
 
 box.innerHTML=visibleStates.map(s=>{
  const accent=s.color||"#3d82f6", army=(s.piyade||0)+(s.suvari||0)+(s.nisanci||0);
  const guns=(s.kucuk_top||0)+(s.orta_top||0)+(s.buyuk_top||0), ships=(s.kucuk_gemi||0)+(s.orta_gemi||0)+(s.buyuk_gemi||0);
  const isMine = s.ownerEmail === currentUserEmail;
  return `<div class="card state-card" style="--accent:${esc(accent)}; ${isMine ? 'box-shadow: 0 0 15px rgba(22, 199, 154, 0.2);' : ''}">
   <div class="state-head"><div><h2>${esc(s.name)}</h2><div class="sub">${esc(s.ruler||"")} ${isMine ? '<span style="color:var(--green)">(Senin Devletin)</span>' : ''}</div></div><span class="badge">${esc(s.title||"Devlet")}</span></div>
   <div class="stats">
    <div>💰 Hazine<br><span class="money">${money(s.treasury)}</span></div><div>👥 Nüfus<br>${num(s.population)}</div>
    <div>⚔ Ordu<br>${num(army)}</div><div>🛡 Top<br>${num(guns)}</div><div>⚓ Gemi<br>${num(ships)}</div><div>😊 Mutluluk<br>${num(s.happiness)}%</div>
   </div>
   <div style="margin-top:14px"><button class="btn blue" onclick="openDetail('${s.id}')">Devlet Yönetimi →</button></div>
  </div>`
 }).join("")
}

function openDetail(id){
 const s=getState(id);
 if(!s) return;
 
 // KESİN GÜVENLİK DUVARI: Başka oyuncunun verisine giriş engelleniyor
 if(!isAdmin && s.ownerEmail !== currentUserEmail) {
    alert("Bu devleti görüntüleme yetkiniz yok!");
    return;
 }
 
 currentId=id;document.getElementById("home").classList.add("hidden");document.getElementById("detail").classList.remove("hidden");
 const st=db.settings, army=(s.piyade||0)+(s.suvari||0)+(s.nisanci||0);
 const eligible=calcEligible(s), guns=(s.kucuk_top||0)+(s.orta_top||0)+(s.buyuk_top||0), ships=(s.kucuk_gemi||0)+(s.orta_gemi||0)+(s.buyuk_gemi||0);
 const annualUpkeep=calcUpkeep(s);
 
 const isOwner = (s.ownerEmail === currentUserEmail);
 const canManage = isAdmin || isOwner;

 const editBtn = isAdmin ? `<button class="btn blue" onclick="openStateForm('${s.id}')">✎ Verileri Düzenle</button>` : ``;
 
 let customItemsHtml = "";
 if(db.settings.customItems && db.settings.customItems.length > 0) {
    customItemsHtml = `<div class="section-title">🌟 ÖZEL BİRİMLER / ÜRÜNLER</div><div class="grid">`;
    db.settings.customItems.forEach(item => {
        customItemsHtml += purchaseBlockCustom(s, item, canManage);
    });
    customItemsHtml += `</div>`;
 }

 // YETKİLENDİRME: Hazine işlemleri butonları
 let treasuryActions = ``;
 if (isAdmin) {
    treasuryActions = `<button class="btn red" onclick="openDeduct('${s.id}')">Hazineden Para Kes</button><button class="btn blue" onclick="openTransfer('${s.id}')">Başka Devlete Para Aktar</button>`;
 } else if (isOwner) {
    treasuryActions = `<button class="btn blue" onclick="openTransfer('${s.id}')">Başka Devlete Para Aktar</button>`;
 }

 document.getElementById("detail").innerHTML=`
 <div class="row"><div><h1 style="color:${esc(s.color||"#fff")}">${esc(s.name)}</h1><div class="sub">${esc(s.ruler||"")} ${isOwner ? '<b style="color:var(--green)">(Sizin Yönetiminizde)</b>' : ''}</div></div><div class="actions"><button class="btn" onclick="renderHome()">← Ana Ekran</button>${editBtn}</div></div>
 <div class="cards" style="margin-top:14px">
  <div class="card"><div class="sub">HAZİNE</div><div class="kpi money">${money(s.treasury)}</div></div>
  <div class="card"><div class="sub">YILLIK GELİR</div><div class="kpi">${money(calcIncome(s))}</div></div>
  <div class="card"><div class="sub">YILLIK GİDER</div><div class="kpi" style="color:#ff6970">${money(calcExpenses(s))}</div></div>
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="card"><h2>👥 Nüfus & Sosyal</h2>
   <div class="item">Toplam Nüfus <b>${num(s.population)}</b></div>
   <div class="item">Elverişli Nüfus <b>${num(eligible)}</b><div class="progress"><i style="width:${Math.min(100,eligible/Math.max(1,s.population)*100)}%"></i></div></div>
   <div class="item">Halk Mutluluğu <b>${num(s.happiness)}%</b><div class="progress"><i style="width:${Math.max(0,Math.min(100,s.happiness))}%"></i></div></div>
   <div class="item">Eğitim Seviyesi <b>${num(s.education)}%</b><div class="progress"><i style="width:${Math.max(0,Math.min(100,s.education))}%"></i></div></div>
   <div class="item">Vergi Oranı <b>${num(s.tax)}%</b></div>
  </div>
  <div class="card"><h2>💰 Ekonomi</h2>
   <div class="item">Vergi Geliri <b class="money">${money(calcIncome(s))}</b><div class="sub">Eğitim bonusu dahil</div></div>
   <div class="item">Ordu Bakımı <b style="color:#ff6970">${money(calcMilitaryUpkeep(s))}</b></div>
   <div class="item">Topçu Bakımı <b style="color:#ff6970">${money(calcArtilleryUpkeep(s))}</b></div>
   <div class="item">Donanma Bakımı <b style="color:#ff6970">${money(calcNavyUpkeep(s))}</b></div>
   <div class="item">Özel Birim Giderleri <b style="color:#ff6970">${money(calcCustomUpkeep(s))}</b></div>
   <div class="item">Sivil Gider <b style="color:#ff6970">${money(s.civilExpense)}</b></div>
   <div class="item">Toplam Otomatik Gider <b style="color:#ff6970">${money(annualUpkeep)}</b></div>
  </div>
 </div>
 
 ${customItemsHtml}

 <div class="section-title">⚔ TEMEL ASKER & DONANMA</div>
 <div class="grid">${purchaseBlock(s,"piyade","🪖","Piyade",1,"eligible", canManage)}
 ${purchaseBlock(s,"suvari","🐎","Süvari",1,"eligible", canManage)}
 ${purchaseBlock(s,"nisanci","🏹","Nişancı",1,"eligible", canManage)}
 ${purchaseBlock(s,"kucuk_top","🔫","Küçük Top",1,"gun", canManage)}
 ${purchaseBlock(s,"orta_top","💣","Orta Top",1,"gun", canManage)}
 ${purchaseBlock(s,"buyuk_top","💥","Büyük Top",1,"gun", canManage)}
 ${purchaseBlock(s,"kucuk_gemi","🚤","Küçük Gemi",1,"ship", canManage)}
 ${purchaseBlock(s,"orta_gemi","⛵","Orta Gemi",1,"ship", canManage)}
 ${purchaseBlock(s,"buyuk_gemi","🚢","Büyük Gemi",1,"ship", canManage)}</div>
 <div class="section-title">🏗 ALTYAPI</div>
 <div class="grid">${infraBlock(s,"kucuk_liman","⚓","Küçük Liman","5 gemi kapasitesi", canManage)}
 ${infraBlock(s,"orta_liman","⚓","Orta Liman","7 gemi kapasitesi", canManage)}
 ${infraBlock(s,"buyuk_liman","⚓","Büyük Liman","10 gemi kapasitesi", canManage)}
 ${infraBlock(s,"kucuk_ocak","🔥","Küçük Top Ocağı","10 top kapasitesi", canManage)}
 ${infraBlock(s,"orta_ocak","🔥","Orta Top Ocağı","20 top kapasitesi", canManage)}
 ${infraBlock(s,"buyuk_ocak","🔥","Büyük Top Ocağı","35 top kapasitesi", canManage)}
 ${infraBlock(s,"okul","🏫","Okul","Eğitim +${st.schoolEducation}%", canManage)}</div>
 <div class="section-title">💸 HAZİNE İŞLEMLERİ</div>
 <div class="actions">${treasuryActions}</div>
 <div class="section-title">📋 DETAYLAR</div>
 <div class="card"><h3>Gelir Detayları</h3><p class="muted">Nüfus × temel vergi × vergi oranı + eğitim verim bonusu.</p><p>Hesaplanan yıllık gelir: <b class="money">${money(calcIncome(s))}</b></p>
 <h3 style="margin-top:18px">Gider Detayları</h3><p class="muted">Asker, top, gemi ve eklenen özel birim bakım giderleri otomatik değişir.</p>
 <p>Toplam: <b style="color:#ff6970">${money(calcExpenses(s))}</b></p></div>`;
}

// HESAPLAMALAR
function calcEligible(s){let base=(s.population||0)*(s.eligibleRate||0)/100;return Math.min(s.population||0,Math.floor(base*(1+(s.happiness||0)/100*db.settings.happinessEligibleBonus)))}
function calcIncome(s){let base=s.population*(s.baseTaxPerPerson||5)*(s.tax/100);return Math.floor(base*(1+(s.education||0)/100*db.settings.educationTaxBonus))}
function calcMilitaryUpkeep(s){return (s.piyade||0)*db.settings.upkeep.piyade+(s.suvari||0)*db.settings.upkeep.suvari+(s.nisanci||0)*db.settings.upkeep.nisanci;}
function calcArtilleryUpkeep(s){return (s.kucuk_top||0)*db.settings.upkeep.kucuk_top+(s.orta_top||0)*db.settings.upkeep.orta_top+(s.buyuk_top||0)*db.settings.upkeep.buyuk_top}
function calcNavyUpkeep(s){return (s.kucuk_gemi||0)*db.settings.upkeep.kucuk_gemi+(s.orta_gemi||0)*db.settings.upkeep.orta_gemi+(s.buyuk_gemi||0)*db.settings.upkeep.buyuk_gemi}
function calcCustomUpkeep(s){
  let total = 0;
  if(db.settings.customItems) {
    db.settings.customItems.forEach(item => { total += (s[item.id]||0) * (item.upkeep||0); });
  }
  return total;
}
function calcUpkeep(s){return calcMilitaryUpkeep(s)+calcArtilleryUpkeep(s)+calcNavyUpkeep(s)+calcCustomUpkeep(s)+Number(s.civilExpense||0)}
function calcExpenses(s){return calcUpkeep(s)}

function updateTotal(id, key, price) {
 const qty = Math.floor(Number(document.getElementById(`qty_${id}_${key}`).value)) || 0;
 document.getElementById(`total_${id}_${key}`).innerHTML = `Toplam: <b style="color:var(--gold)">${money(price * qty)}</b>`;
}

// SATIN ALMA BLOKLARI
function purchaseBlock(s,key,icon,label,unit,type, canManage){
 let count=s[key]||0, price=db.settings.prices[key]||0, cap="";
 if(type==="ship") cap=`Kapasite: ${num(shipCapacity(s))} / ${num(shipCapMax(s))}`;
 if(type==="gun") cap=`Kapasite: ${num(gunCapacity(s))} / ${num(gunCapMax(s))}`;
 
 const actionsHtml = canManage 
    ? `<div style="display:flex;gap:5px;align-items:center;margin-bottom:5px">

function shipCapacity(s){return (s.kucuk_gemi||0)+(s.orta_gemi||0)+(s.buyuk_gemi||0)}
function shipCapMax(s){return (s.kucuk_liman||0)*db.settings.capacity.kucuk_liman+(s.orta_liman||0)*db.settings.capacity.orta_liman+(s.buyuk_liman||0)*db.settings.capacity.buyuk_liman}
function gunCapacity(s){return (s.kucuk_top||0)+(s.orta_top||0)+(s.buyuk_top||0)}
function gunCapMax(s){return (s.kucuk_ocak||0)*db.settings.capacity.kucuk_ocak+(s.orta_ocak||0)*db.settings.capacity.orta_ocak+(s.buyuk_ocak||0)*db.settings.capacity.buyuk_ocak}

async function buyBulk(id,key){
 const s=getState(id);
 if(!s) return;
 if(!isAdmin && s.ownerEmail !== currentUserEmail) { alert("Yetkiniz yok!"); return; } 
 
 const price=db.settings.prices[key]||0;
 const qty = Math.floor(Number(document.getElementById(`qty_${id}_${key}`).value)) || 0;
 if(qty <= 0) { alert("Lütfen geçerli bir miktar girin."); return; }
 const totalCost = price * qty;
 if(s.treasury<totalCost){alert(`Hazine yetersiz! Toplam maliyet: ${money(totalCost)}`);return}
 if(["piyade","suvari","nisanci"].includes(key) && calcEligible(s)<qty){alert("Elverişli nüfus yetersiz.");return}
 if(key.includes("gemi") && (shipCapacity(s) + qty) > shipCapMax(s)){alert("Limanda boş gemi kapasitesi yok.");return}
 if(key.includes("top") && (gunCapacity(s) + qty) > gunCapMax(s)){alert("Top ocağında boş kapasite yok.");return}
 s.treasury -= totalCost;
 s[key] = (s[key]||0) + qty;
 if(["piyade","suvari","nisanci"].includes(key)) s.population = Math.max(0, s.population - qty);
 queueSave(); openDetail(id);
}
async function buyInfraBulk(id,key){
 const s=getState(id);
 if(!s) return;
 if(!isAdmin && s.ownerEmail !== currentUserEmail) { alert("Yetkiniz yok!"); return; }

 const price=db.settings.prices[key]||0;
 const qty = Math.floor(Number(document.getElementById(`qty_${id}_${key}`).value)) || 0;
 if(qty <= 0) { alert("Lütfen geçerli bir miktar girin."); return; }
 const totalCost = price * qty;
 if(s.treasury<totalCost){alert(`Hazine yetersiz! Toplam maliyet: ${money(totalCost)}`);return}
 s.treasury -= totalCost;
 s[key] = (s[key]||0) + qty;
 if(key==="okul") s.education=Math.min(100,(s.education||0)+(db.settings.schoolEducation*qty));
 queueSave(); openDetail(id);
}
async function buyCustomBulk(id, itemId){
 const s = getState(id);
 if(!s) return;
 if(!isAdmin && s.ownerEmail !== currentUserEmail) { alert("Yetkiniz yok!"); return; } 

 const item = (db.settings.customItems||[]).find(x=>x.id===itemId);
 if(!item) return;
 const qty = Math.floor(Number(document.getElementById(`qty_${id}_${itemId}`).value)) || 0;
 if(qty <= 0) { alert("Geçerli miktar girin."); return; }
 const totalCost = item.price * qty;
 if(s.treasury < totalCost){alert(`Hazine yetersiz! Gerekli: ${money(totalCost)}`);return;}
 if(item.category === 'asker' && calcEligible(s) < qty){alert("Elverişli nüfus yetersiz!"); return;}
 s.treasury -= totalCost;
 s[item.id] = (s[item.id]||0) + qty;
 if(item.category === 'asker') s.population = Math.max(0, s.population - qty);
 queueSave(); openDetail(id);
}

function field(k,l,v,t="text"){return `<div><label>${l}</label><input id="f_${k}" type="${t}" value="${esc(v)}"></div>`}
function saveState(id){
 const keys=["name","ownerEmail","ruler","title","color","treasury","population","eligibleRate","tax","happiness","education","baseTaxPerPerson","civilExpense","piyade","suvari","nisanci","kucuk_top","orta_top","buyuk_top","kucuk_gemi","orta_gemi","buyuk_gemi","kucuk_liman","orta_liman","buyuk_liman","kucuk_ocak","orta_ocak","buyuk_ocak","okul"];
 if(db.settings.customItems) { db.settings.customItems.forEach(item => keys.push(item.id)); }
 const o={};keys.forEach(k=>o[k]=["name","ownerEmail","ruler","title","color"].includes(k)?document.getElementById("f_"+k).value:Number(document.getElementById("f_"+k).value||0));
 if(!o.name){alert("Devlet adı gerekli.");return}
 o.ownerEmail = (o.ownerEmail || "").trim().toLowerCase();
 if(id){Object.assign(getState(id),o)}else{db.states.push({id:crypto.randomUUID(),...o})}
 closeModal();queueSave();renderHome()
}
function deleteState(id){if(confirm("Bu devlet silinsin mi?")){db.states=db.states.filter(x=>x.id!==id);closeModal();queueSave();renderHome()}}

// HAZİNE & TRANSFER
function openDeduct(id){ 
 if(!isAdmin) { alert("Sadece admin hazineden para silebilir."); return; } 
 modal(`<h2>Hazineden Para Kes</h2><label>Tutar</label><input id="deductAmt" type="number" min="0"><label>Açıklama</label><textarea id="deductDesc" placeholder="Örn: Saray masrafı, olağanüstü ödeme..."></textarea><div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">İptal</button><button class="btn red" onclick="deduct('${id}')">KES VE KAYDET</button></div>`) 
}
function deduct(id){
 if(!isAdmin) return;
 let s=getState(id),a=Number(document.getElementById("deductAmt").value||0),d=document.getElementById("deductDesc").value.trim();
 if(a<=0||a>s.treasury){alert("Tutar geçersiz veya hazine yetersiz.");return}
 s.treasury-=a;s.expenseLog=s.expenseLog||[];s.expenseLog.unshift({amount:a,description:d||"Açıklamasız",date:new Date().toISOString()});closeModal();queueSave();openDetail(id)
}
function openTransfer(id){
 const s = getState(id);
 if(!isAdmin && s.ownerEmail !== currentUserEmail) { alert("Yetkiniz yok!"); return; } 
 const opts=db.states.filter(x=>x.id!==id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 modal(`<h2>Devletler Arası Para Aktarımı</h2><label>Hedef Devlet</label><select id="transferTarget">${opts}</select><label>Tutar</label><input id="transferAmt" type="number" min="0"><label>Açıklama</label><textarea id="transferDesc"></textarea><div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">İptal</button><button class="btn blue" onclick="transfer('${id}')">AKTAR</button></div>`)
}
function transfer(id){
 let s=getState(id);
 if(!isAdmin && s.ownerEmail !== currentUserEmail) { alert("Yetkiniz yok!"); return; } 
 let t=getState(document.getElementById("transferTarget").value),a=Number(document.getElementById("transferAmt").value||0),d=document.getElementById("transferDesc").value.trim();
 if(!t||a<=0||a>s.treasury){alert("Tutar geçersiz.");return}
 s.treasury-=a;t.treasury+=a;db.transfers.unshift({from:s.name,to:t.name,amount:a,description:d,date:new Date().toISOString()});closeModal();queueSave();openDetail(id)
}

function addCustomItem(){
   const name = document.getElementById("f_ci_name").value.trim(), cat = document.getElementById("f_ci_cat").value, price = Number(document.getElementById("f_ci_price").value)||0, upkeep = Number(document.getElementById("f_ci_upkeep").value)||0, icon = document.getElementById("f_ci_icon").value.trim()||"📦";
   if(!name){alert("Ürün adı boş olamaz!"); return;}
   const id = "c_" + crypto.randomUUID().split("-")[0];
   db.settings.customItems = db.settings.customItems || [];
   db.settings.customItems.push({id, name, category: cat, price, upkeep, icon});
   saveAdmin(false);
}
function removeCustomItem(id){
   if(!confirm("Bu öğeyi silmek istediğinize emin misiniz?")) return;
   db.settings.customItems = db.settings.customItems.filter(x => x.id !== id);
   saveAdmin(false);
}
function saveAdmin(doClose = true){
 Object.keys(db.settings.prices).forEach(k=>{ const el=document.getElementById("f_p_"+k); if(el) db.settings.prices[k]=Number(el.value||0); });
 Object.keys(db.settings.capacity).forEach(k=>{ const el=document.getElementById("f_c_"+k); if(el) db.settings.capacity[k]=Number(el.value||0); });
 Object.keys(db.settings.upkeep).forEach(k=>{ const el=document.getElementById("f_u_"+k); if(el) db.settings.upkeep[k]=Number(el.value||0); });
 const elSchool = document.getElementById("f_schoolEducation"); if(elSchool) db.settings.schoolEducation = Number(elSchool.value||0);
 const elEdu = document.getElementById("f_educationTaxBonus"); if(elEdu) db.settings.educationTaxBonus = Number(elEdu.value||0);
 const elHap = document.getElementById("f_happinessEligibleBonus"); if(elHap) db.settings.happinessEligibleBonus = Number(elHap.value||0);
 if(doClose){ closeModal(); queueSave(); if(currentId) openDetail(currentId); } else { queueSave(); openAdmin(); }
}
