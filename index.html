<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devlet Yönetim Paneli</title>
<!-- Askeri ve Stratejik Fontlar -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Playfair+Display:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg: #0a0b0d;
 --panel: #16181b;
 --panel-light: #202327;
 --line: #3a3e45;
 --border-gold: #9a8251;
 --border-steel: #50555c;
 --text: #dcdcdc;
 --muted: #8b929e;
 --green: #4ade80; /* HOI4 yeşili */
 --red: #ef4444;
 --gold: #d4af37;
 --hoi-tab: #2d3136;
}
*{box-sizing:border-box} 
body{margin:0;background:var(--bg) url('https://images.unsplash.com/photo-1585314062340-f1a5a7c9328d?q=80&w=2000&auto=format&fit=crop') fixed center/cover;color:var(--text);font-family:'Roboto Condensed', sans-serif;}
body::before { content:''; position:fixed; inset:0; background:rgba(10,11,13,0.85); z-index:-1; }
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.container{max-width:1300px;margin:auto;padding:15px; position:relative; z-index:1;}

/* ÜST BAR (TOP BAR) */
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(to bottom, #1d2025, #111316);border:1px solid var(--line);border-bottom:3px solid var(--border-gold);padding:12px 18px;border-radius:4px;position:sticky;top:5px;z-index:50;box-shadow: 0 5px 15px rgba(0,0,0,0.8);}
.brand{font-size:20px;font-weight:700; color:var(--gold); font-family:'Oswald', sans-serif; letter-spacing:1px; text-shadow: 2px 2px 4px #000;}
.sub{color:var(--muted);font-size:12px;}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* BUTONLAR */
.btn {
    background: linear-gradient(180deg, #3a3e45 0%, #202327 100%);
    border: 1px solid var(--border-steel);
    border-radius: 3px;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    padding: 8px 12px;
    transition: all 0.2s;
    text-transform: uppercase;
}
.btn:hover { background: linear-gradient(180deg, #4b5058 0%, #2a2e33 100%); border-color: var(--muted); }
.btn:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.6); }
.btn.green { background: linear-gradient(180deg, #2e5c3e 0%, #173622 100%); border-color: #4CAF50; }
.btn.blue { background: linear-gradient(180deg, #2b456b 0%, #172842 100%); border-color: #3d82f6; }
.btn.red { background: linear-gradient(180deg, #6b2b2b 0%, #421717 100%); border-color: #ef4444; }
.btn.gold { background: linear-gradient(180deg, #8a6a1c 0%, #523f11 100%); border-color: var(--gold); }
.btn.small{padding:5px 8px;font-size:12px}

/* FORM ELEMANLARI */
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 3px; text-transform:uppercase; font-family:'Oswald', sans-serif;}
input,select,textarea{width:100%;padding:8px;border-radius:3px;border:1px solid var(--line);background:#0b0d10;color:var(--text);outline:none; box-shadow:inset 0 2px 5px rgba(0,0,0,0.6);}
input:focus, select:focus, textarea:focus { border-color:var(--border-gold); }

/* IZGARALAR & KARTLAR (ANA EKRAN) */
.screen{margin-top:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:15px}
.state-card{
    background: linear-gradient(135deg, rgba(22,24,27,0.95), rgba(15,16,18,0.95));
    border: 2px solid var(--border-steel);
    border-radius: 4px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
}
.state-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px; position:relative; z-index:2;}
.state-head h2{margin:0; font-family:'Playfair Display', serif; font-size:22px;}
.badge{border:1px solid var(--border-gold);padding:3px 6px;border-radius:3px;color:var(--gold);font-size:10px; background:#111; font-family:'Oswald', sans-serif; text-transform:uppercase;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px; font-size:13px;}
.stats-grid div{background:rgba(0,0,0,0.4); padding:6px; border:1px solid var(--line); border-radius:3px;}
.money{color:var(--green);font-weight:700}
.home-ruler-img { width:48px; height:48px; border-radius:3px; border:1px solid var(--border-gold); object-fit:cover; margin-right:10px; flex-shrink:0; background:#000;}

/* HOI4 TARZI DETAY EKRANI (POLITICAL SCREEN) */
.detail-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 15px;
    align-items: start;
}

/* SOL PANEL (LİDER & SİYASET) */
.political-panel {
    background: var(--panel);
    border: 2px solid var(--border-steel);
    border-top: 4px solid var(--border-gold);
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    overflow: hidden;
}
.political-header {
    background: linear-gradient(to right, #2a2e33, #16181b);
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid var(--border-steel);
}
.political-header h1 { margin:0; font-family:'Playfair Display', serif; font-size:24px; text-shadow:2px 2px 4px #000; }
.ruler-portrait-container {
    padding: 15px;
    background: url('https://www.transparenttextures.com/patterns/black-scales.png');
    display: flex;
    flex-direction: column;
    align-items: center;
    border-bottom: 2px solid var(--line);
}
.big-portrait {
    width: 100%;
    max-width: 250px;
    aspect-ratio: 3/4;
    object-fit: cover;
    border: 3px solid var(--border-gold);
    box-shadow: 0 8px 15px rgba(0,0,0,0.8);
    background: #000;
    border-radius: 2px;
}
.ruler-name-plate {
    background: linear-gradient(180deg, #1d2025, #0b0d10);
    border: 1px solid var(--border-steel);
    width: 100%;
    text-align: center;
    padding: 8px;
    margin-top: -15px; /* Overlap effect */
    position: relative;
    z-index: 2;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
}
.ruler-name-plate strong { display:block; font-size:18px; font-family:'Playfair Display', serif; color:var(--gold);}
.ruler-name-plate span { font-size:11px; color:var(--muted); text-transform:uppercase; font-family:'Oswald', sans-serif;}

.pol-stats { padding: 12px; }
.pol-stat-row { display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px dashed var(--line); padding-bottom:4px; font-size:14px; }
.pol-stat-row span:last-child { font-weight:bold; font-family:'Oswald', sans-serif;}
.prog-bar-bg { background:#111; height:12px; border:1px solid var(--line); border-radius:2px; margin-top:4px; overflow:hidden; position:relative; }
.prog-bar-fill { background:var(--green); height:100%; }

/* SAĞ PANEL (SEKMELER & İÇERİK) */
.content-panel {
    background: rgba(22,24,27,0.85);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 800px;
    display: flex;
    flex-direction: column;
}
.hoi-tabs {
    display: flex;
    background: #111;
    border-bottom: 2px solid var(--border-gold);
}
.hoi-tab {
    flex: 1;
    padding: 12px 5px;
    text-align: center;
    background: linear-gradient(180deg, #2d3136, #16181b);
    border-right: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
}
.hoi-tab:hover { background: #2a2e33; color: #fff; }
.hoi-tab.active {
    background: linear-gradient(180deg, #3a3e45, rgba(22,24,27,0.9));
    color: var(--gold);
    border-bottom: none;
    box-shadow: inset 0 3px 0 var(--border-gold);
}
.tab-content { padding: 15px; display: none; }
.tab-content.active { display: block; }

/* ASKER & ÜRETİM KARTLARI (DIVISION CARDS) */
.unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
}
.unit-card {
    display: flex;
    background: linear-gradient(180deg, #1d2025, #111316);
    border: 1px solid var(--border-steel);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    transition: transform 0.2s;
}
.unit-card:hover { border-color:var(--border-gold); transform:translateY(-2px); }
.unit-img-box {
    width: 100px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    position: relative;
    background: #000;
}
.unit-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
}
.unit-details {
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.unit-title { font-family:'Oswald', sans-serif; font-size:16px; color:var(--text); margin-bottom:4px; text-transform:uppercase;}
.unit-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
}
.unit-info-grid strong { color: var(--text); }
.unit-buy-row {
    display: flex;
    gap: 5px;
    margin-top: auto;
}
.unit-buy-row input { padding:5px; height:30px; font-size:12px; text-align:center;}
.unit-buy-row button { height:30px; flex:1; font-size:12px;}

/* MALİYE VE DİĞER LİSTELER */
.list-item {
    background: #16181b;
    border: 1px solid var(--line);
    padding: 10px;
    border-radius: 3px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.list-item b { color:var(--gold); }

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;padding:15px;z-index:100; backdrop-filter:blur(3px);}
.modal.show{display:flex}
.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#16181b;border:2px solid var(--border-gold);border-radius:4px;padding:20px; box-shadow:0 10px 40px rgba(0,0,0,0.9);}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}

.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.authbox{position:relative; z-index:1; width:min(400px,100%);background:rgba(22,24,27,0.95);padding:30px;border-radius:4px;border:1px solid var(--border-gold); box-shadow:0 0 30px rgba(0,0,0,0.9); text-align:center;}
.error{color:#ef4444;font-size:12px;margin-top:10px;white-space:pre-wrap}.success{color:var(--green);font-size:12px;margin-top:10px;white-space:pre-wrap}

@media(max-width:900px){
    .detail-layout { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
 <div class="authbox">
  <h1 class="brand" style="font-size:28px; margin-bottom:5px;">⚔️ STATE COMMAND</h1>
  <p class="sub" style="margin-bottom:20px;">Divan-ı Hümayun Girişi</p>
  <div style="display:flex;gap:5px;margin-bottom:15px;"><button id="loginTab" class="btn blue" style="flex:1;">Giriş Yap</button><button id="signupTab" class="btn" style="flex:1;">Kayıt Ol</button></div>
  <label style="text-align:left;">E-posta</label><input id="email" type="email" autocomplete="email">
  <label style="text-align:left; margin-top:10px;">Şifre</label><input id="password" type="password" autocomplete="current-password">
  <button id="authBtn" class="btn green" style="width:100%;margin-top:20px; padding:12px;">Giriş Yap</button>
  <div id="authMsg"></div>
 </div>
</div>

<div id="app" class="hidden">
<div class="container">
<header class="top">
 <div><div class="brand">⚔️ GRAND STRATEGY PANEL</div><div id="syncText" class="sub">Sunucuya bağlanılıyor...</div></div>
 <div class="actions" id="topActions"></div>
</header>
<div id="home" class="screen">
 <h2 class="section-title">🌍 HARİTADAKİ DEVLETLER</h2>
 <div id="stateGrid" class="cards"></div>
</div>
<div id="detail" class="screen hidden"></div>
</div></div>

<div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ---------- YETKİLENDİRME AYARLARI ----------
const SUPER_ADMINS = ["osman.baris.sarikaya1@gmail.com"]; 
let currentUserEmail = null;
let isAdmin = false;

const SUPABASE_URL=String(window.SUPABASE_URL||"").trim();
const SUPABASE_KEY=String(window.SUPABASE_KEY||"").trim();
let sb=null;
let db={states:[],settings:null,transfers:[], purchaseLog:[]}, currentId=null, authMode="login", saveTimer=null;

// HOI4 Tarzı Resim Sabitleri (Placeholderlar)
const DEFAULT_IMAGES = {
    piyade: "https://images.unsplash.com/photo-1599839619722-39751411ea63?w=300&q=80",
    suvari: "https://images.unsplash.com/photo-1551269901-5c5e14c25df7?w=300&q=80",
    nisanci: "https://images.unsplash.com/photo-1589505843797-28d8ed2160d5?w=300&q=80",
    kucuk_top: "https://images.unsplash.com/photo-1584281721532-68041d8e1e7f?w=300&q=80",
    orta_top: "https://images.unsplash.com/photo-1584281721532-68041d8e1e7f?w=300&q=80",
    buyuk_top: "https://images.unsplash.com/photo-1584281721532-68041d8e1e7f?w=300&q=80",
    kucuk_gemi: "https://images.unsplash.com/photo-1605724580211-13c545041065?w=300&q=80",
    orta_gemi: "https://images.unsplash.com/photo-1605724580211-13c545041065?w=300&q=80",
    buyuk_gemi: "https://images.unsplash.com/photo-1605724580211-13c545041065?w=300&q=80",
    kucuk_liman: "https://images.unsplash.com/photo-1506509536839-4d6cb1dbf212?w=300&q=80",
    orta_liman: "https://images.unsplash.com/photo-1506509536839-4d6cb1dbf212?w=300&q=80",
    buyuk_liman: "https://images.unsplash.com/photo-1506509536839-4d6cb1dbf212?w=300&q=80",
    kucuk_ocak: "https://images.unsplash.com/photo-1506456075677-4dbb6c2069fa?w=300&q=80",
    orta_ocak: "https://images.unsplash.com/photo-1506456075677-4dbb6c2069fa?w=300&q=80",
    buyuk_ocak: "https://images.unsplash.com/photo-1506456075677-4dbb6c2069fa?w=300&q=80",
    okul: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=300&q=80",
    default_ruler: "https://images.unsplash.com/photo-1618641986557-1ecd230959aa?w=400&q=80"
};

function initSupabase(){
 if(!window.supabase || typeof window.supabase.createClient!=="function") throw new Error("Supabase yüklenemedi.");
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
}

const defaultSettings={
 prices:{piyade:10,suvari:50,nisanci:20,kucuk_top:3000,orta_top:6000,buyuk_top:10000,kucuk_gemi:15000,orta_gemi:30000,buyuk_gemi:60000,kucuk_liman:100000,orta_liman:180000,buyuk_liman:300000,kucuk_ocak:80000,orta_ocak:150000,buyuk_ocak:250000,okul:120000},
 capacity:{kucuk_liman:5,orta_liman:7,buyuk_liman:10,kucuk_ocak:10,orta_ocak:20,buyuk_ocak:35},
 upkeep:{piyade:1,suvari:5,nisanci:2,kucuk_top:250,orta_top:450,buyuk_top:800,kucuk_gemi:1200,orta_gemi:2200,buyuk_gemi:4000},
 edictCost:{erzak:2, karakol:1.5, panayir:1, ibadethane:3, anit:2.5, denetim:0.5},
 campaignCost:{piyade:2, suvari:5, nisanci:3, kucuk_top:200, orta_top:500, buyuk_top:1000},
 schoolEducation:2,
 customItems: [] 
};

const EDICTS = [
    { id: 'erzak', name: 'Erzak Dağıtımı', desc: 'Ambarları açarak halkı doyur.', pts: 10, icon: '🍞' },
    { id: 'karakol', name: 'Karakol İnşası', desc: 'Güvenliği sağla.', pts: 8, icon: '🛡️' },
    { id: 'panayir', name: 'Panayır Düzenle', desc: 'Şenlikler düzenle.', pts: 7, icon: '🎪' },
    { id: 'ibadethane', name: 'İbadethane / Hamam', desc: 'Manevi temizlik.', pts: 7, icon: '🕌' },
    { id: 'anit', name: 'Anıt İnşası', desc: 'Görkemli anıtlar dik.', pts: 5, icon: '🏛️' },
    { id: 'denetim', name: 'Pazar Denetimi', desc: 'Karaborsacıları engelle.', pts: '5-9', icon: '⚖️' }
];

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function cleanUrl(u){
    if(!u) return "";
    let s = String(u).trim();
    let m = s.match(/https?:\/\/[^\s"'<>\[\]\)]+/);
    return m ? m[0] : s;
}
function money(n){return Number(n||0).toLocaleString("tr-TR")+" TL"}
function num(n){return Number(n||0).toLocaleString("tr-TR")}
function getState(id){return db.states.find(s=>s.id===id)}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function modal(html){document.getElementById("modalContent").innerHTML=html;document.getElementById("modal").classList.add("show")}
function toast(msg,ok=false){document.getElementById("syncText").textContent=(ok?"✓ ":"⚠ ")+msg}

async function init(){
 try{
  initSupabase();
  const {data:{session},error}=await sb.auth.getSession();
  if(error) throw error;
  sb.auth.onAuthStateChange((_e,s)=>{if(s) showApp(s); else showAuth()});
  if(session) showApp(session); else showAuth();
 }catch(e){
  const msg=document.getElementById("authMsg");
  if(msg){msg.className="error";msg.textContent="❌ Supabase Hatası: "+(e.message||e);}
  console.error(e);
 }
}
function showAuth(){
    document.getElementById("app").classList.add("hidden");
    document.getElementById("auth").classList.remove("hidden");
    document.body.style.background = "var(--bg) url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=2000&auto=format&fit=crop') center/cover";
}

async function showApp(session){
 currentUserEmail = (session?.user?.email || "").trim().toLowerCase();
 isAdmin = SUPER_ADMINS.map(m => m.trim().toLowerCase()).includes(currentUserEmail);
 
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 
 const actionsDiv = document.getElementById("topActions");
 if(isAdmin){
    actionsDiv.innerHTML = `
    <button class="btn gold" onclick="passOneYear()">⏳ 1 YILI GEÇİR</button>
    <button class="btn" onclick="openPurchaseLogs()">📜 LOGLAR</button>
    <button class="btn green" onclick="openStateForm()">＋ DEVLET EKLE</button>
    <button class="btn blue" onclick="openAdmin()">⚙ ADMİN</button>
    <button class="btn red" onclick="logout()">ÇIKIŞ</button>`;
 } else {
    actionsDiv.innerHTML = `<span style="color:var(--muted); font-size:12px; margin-right:10px;">👤 ${esc(currentUserEmail)}</span><button class="btn red" onclick="logout()">ÇIKIŞ</button>`;
 }

 await loadDB();
 renderHome();
}

function setAuthMode(m){authMode=m;document.getElementById("authBtn").textContent=m==="login"?"Giriş Yap":"Kayıt Ol";document.getElementById("loginTab").className="btn "+(m==="login"?"blue":"");document.getElementById("signupTab").className="btn "+(m==="signup"?"blue":"");}
document.getElementById("loginTab").onclick=()=>setAuthMode("login");document.getElementById("signupTab").onclick=()=>setAuthMode("signup");
document.getElementById("authBtn").onclick=async()=>{
 const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
 const msg=document.getElementById("authMsg");msg.className="";msg.textContent="İşleniyor…";
 try{
  if(authMode==="signup"){const r=await sb.auth.signUp({email,password});if(r.error)throw r.error;msg.className="success";msg.textContent=r.data.session?"Hesap oluşturuldu.":"Hesap oluşturuldu. E-posta doğrulaması açıksa gelen kutunu kontrol et."}
  else {const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error}
 }catch(e){msg.className="error";msg.textContent="❌ "+(e.message||e)}
};
async function logout(){await sb.auth.signOut()}

async function loadDB(){
 if(!sb){toast("Supabase bağlantısı kurulamadı.");return}
 toast("Veriler yükleniyor…");
 const {data,error}=await sb.from("game_state").select("data").eq("id",1).maybeSingle();
 if(error){toast("Supabase okuma hatası: "+error.message);return}
 if(data?.data){
    db=data.data;
    db.settings={...defaultSettings,...(db.settings||{})};
    db.settings.prices={...defaultSettings.prices,...(db.settings?.prices||{})};
    db.settings.capacity={...defaultSettings.capacity,...(db.settings?.capacity||{})};
    db.settings.upkeep={...defaultSettings.upkeep,...(db.settings?.upkeep||{})};
    db.settings.edictCost={...defaultSettings.edictCost,...(db.settings?.edictCost||{})};
    db.settings.campaignCost={...defaultSettings.campaignCost,...(db.settings?.campaignCost||{})};
    db.settings.customItems = db.settings.customItems || [];

    db.states.forEach(s => { 
        s.customLedger = s.customLedger || []; 
        s.permanentLedger = s.permanentLedger || [];

    });
 }
 else {db={states:[],settings:structuredClone(defaultSettings),transfers:[], purchaseLog:[]};await saveDB()}

}

// ---------------- MALİYE DEFTERİ FONKSİYONLARI ----------------
function addLedgerItem(stateId) {
    if(!isAdmin) return;
    let s = getState(stateId);
    let desc = document.getElementById('ledger_desc_'+stateId).value.trim();
    let amt = Number(document.getElementById('ledger_amt_'+stateId).value) || 0;
    let type = document.getElementById('ledger_type_'+stateId).value;
    if(!desc) { alert("Açıklama yazmalısınız."); return; }
    
    if(type === 'perm') {
        s.permanentLedger = s.permanentLedger || [];
        s.permanentLedger.push({ desc, amount: amt });
    } else {
        s.customLedger = s.customLedger || [];
        s.customLedger.push({ desc, amount: amt });
    }
    queueSave(); openDetail(stateId);
}
function removeLedgerItem(stateId, index) {
    if(!isAdmin) return;
    let s = getState(stateId);
    if(!s || !s.customLedger) return;
    s.customLedger.splice(index, 1);
    queueSave(); openDetail(stateId);
}
function removePermLedgerItem(stateId, index) {
    if(!isAdmin) return;
    let s = getState(stateId);
    if(!s || !s.permanentLedger) return;
    s.permanentLedger.splice(index, 1);
    queueSave(); openDetail(stateId);
}

// ---------------- HESAPLAMALAR ----------------
function calcPop(s){
  let hap = Number(s.happiness) || 0;
  let pop = Number(s.population) || 0;
  let edu = Number(s.education) || 0;
  let anarRate = hap >= 60 ? 0 : Math.floor((59 - hap)/10)*10 + 10;
  if(hap < 0) anarRate = 60; 
  let anarCount = Math.floor(pop * (anarRate/100));
  let armySize = (s.piyade||0) + (s.suvari||0) + (s.nisanci||0);
  if(db.settings.customItems) {
     db.settings.customItems.filter(x=>x.category==='asker' && (!x.faction || x.faction===s.id)).forEach(x => armySize += (s[x.id]||0));
  }
  let eligRate = hap * 0.3;
  let maxElig = Math.floor(pop * (eligRate/100));
  let availableElig = Math.max(0, maxElig - armySize);
  let remCount = Math.max(0, pop - anarCount - Math.max(maxElig, armySize));
  let eduCount = Math.floor(remCount * (edu/100));
  let otherCount = remCount - eduCount;
  return { anar: anarCount, anarRate, elig: availableElig, maxElig, eligRate: eligRate.toFixed(1), armySize: armySize, edu: eduCount, eduRate: edu, other: otherCount, remaining: remCount };
}
function calcIncome(s){
  const p = calcPop(s);
  const baseTax = (Number(s.baseTaxPerPerson)||5) * ((Number(s.tax)||0)/100);
  return Math.floor((p.elig * baseTax) + (p.other * baseTax) + (p.edu * baseTax * 1.5));
}
function calcPermIncome(s){
  let total = 0;
  if(s.permanentLedger && s.permanentLedger.length > 0) s.permanentLedger.forEach(item => { total += item.amount; });
  return total;
}
function calcExpenses(s){
  let m = (s.piyade||0)*db.settings.upkeep.piyade+(s.suvari||0)*db.settings.upkeep.suvari+(s.nisanci||0)*db.settings.upkeep.nisanci;
  let a = (s.kucuk_top||0)*db.settings.upkeep.kucuk_top+(s.orta_top||0)*db.settings.upkeep.orta_top+(s.buyuk_top||0)*db.settings.upkeep.buyuk_top;
  let n = (s.kucuk_gemi||0)*db.settings.upkeep.kucuk_gemi+(s.orta_gemi||0)*db.settings.upkeep.orta_gemi+(s.buyuk_gemi||0)*db.settings.upkeep.buyuk_gemi;
  let c = 0;
  if(db.settings.customItems) db.settings.customItems.forEach(item => { c += (s[item.id]||0) * (item.upkeep||0); });
  return m + a + n + c + Number(s.civilExpense||0);
}
function calcUpkeep(s){ return calcExpenses(s); }

}

    let edict = EDICTS.find(e => e.id === edictId);

    let pts = edictId === 'denetim' ? Math.floor(Math.random() * 5) + 5 : edict.pts;

    s.happiness = Math.min(100, (s.happiness||0) + (pts/10));

function calcCampCost(id) {
    const s = getState(id);
    let total = 0;
    document.querySelectorAll('input[id^="camp_"]').forEach(el => {
        let k = el.id.replace('camp_','');
        let val = Number(el.value) || 0;
        let max = Number(el.max) || 0;
        if(val > max) { val = max; el.value = max; }
        if(val < 0) { val = 0; el.value = 0; }
        let cost = db.settings.campaignCost[k] !== undefined ? db.settings.campaignCost[k] : ((db.settings.customItems||[]).find(x=>x.id===k)?.campCost || 0);
        total += val * cost;
    });
    document.getElementById('campTotalCost').innerHTML = money(total);
}
function openCampaign(id) {
    const s = getState(id);
    const cc = db.settings.campaignCost || {};
    const units = [
        {key: 'piyade', label: 'Piyade', max: s.piyade||0, cost: cc.piyade||0},
        {key: 'suvari', label: 'Süvari', max: s.suvari||0, cost: cc.suvari||0},

            </div>
        </div>`;
    });
    html += `</div><div style="background:#0b0d10; padding:15px; border-radius:4px; text-align:center; font-size:18px; border:1px solid var(--border-gold);">
        Toplam İkmal: <b id="campTotalCost" style="color:var(--gold)">0 TL</b></div>
    <div class="actions" style="margin-top:15px;"><button class="btn" onclick="closeModal()">İPTAL</button><button class="btn red" style="flex:1; font-weight:bold;" onclick="startCampaign('${id}')">SEFERİ BAŞLAT (ÖDE)</button></div>`;
    modal(html);
}
function startCampaign(id) {
    const s = getState(id);
    let total = 0; let details = [];
    document.querySelectorAll('input[id^="camp_"]').forEach(el => {
        let k = el.id.replace('camp_','');
        let val = Number(el.value) || 0;
        if(val > 0) {
            let cost = db.settings.campaignCost[k] !== undefined ? db.settings.campaignCost[k] : ((db.settings.customItems||[]).find(x=>x.id===k)?.campCost || 0);
            let name = db.settings.campaignCost[k] !== undefined ? k.replace('_',' ') : ((db.settings.customItems||[]).find(x=>x.id===k)?.name);
            total += val * cost; details.push(`${num(val)} ${name}`); 
        }
    });
    if(total <= 0) return;
    if(s.treasury < total) { alert("Hazine yetersiz! Gerekli: " + money(total)); return; }
    s.treasury -= total;
    addLog(s.name, `Sefer Ordusu: ${details.join(', ')}`, 1, total);
    closeModal(); queueSave(); openDetail(id);
}

    });
    
    summaryHtml += "</div></div><div class='actions' style='margin-top:15px;'><button class='btn blue' style='width:100%;' onclick='closeModal()'>KAPAT</button></div>";
    queueSave(); modal(summaryHtml);

}

function addCustomItem(){
   const name = document.getElementById("f_ci_name").value.trim(), cat = document.getElementById("f_ci_cat").value, faction = document.getElementById("f_ci_faction").value;
   const price = Number(document.getElementById("f_ci_price").value)||0, upkeep = Number(document.getElementById("f_ci_upkeep").value)||0, campCost = Number(document.getElementById("f_ci_campCost").value)||0, icon = cleanUrl(document.getElementById("f_ci_icon").value);
   if(!name){alert("İsim gerekli!"); return;}
   const id = "c_" + crypto.randomUUID().split("-")[0];
   db.settings.customItems = db.settings.customItems || [];
   db.settings.customItems.push({id, name, category: cat, price, upkeep, campCost, icon, faction});
   saveAdmin(false);
}
function removeCustomItem(id){
   if(!confirm("Emin misiniz?")) return;
   db.settings.customItems = db.settings.customItems.filter(x => x.id !== id);
   saveAdmin(false);
}
function saveAdmin(doClose = true){
 Object.keys(db.settings.prices).forEach(k=>{ const el=document.getElementById("f_p_"+k); if(el) db.settings.prices[k]=Number(el.value||0); });
 Object.keys(db.settings.capacity).forEach(k=>{ const el=document.getElementById("f_c_"+k); if(el) db.settings.capacity[k]=Number(el.value||0); });
 Object.keys(db.settings.upkeep).forEach(k=>{ const el=document.getElementById("f_u_"+k); if(el) db.settings.upkeep[k]=Number(el.value||0); });
 Object.keys(db.settings.edictCost).forEach(k=>{ const el=document.getElementById("f_ec_"+k); if(el) db.settings.edictCost[k]=Number(el.value||0); });
 Object.keys(db.settings.campaignCost).forEach(k=>{ const el=document.getElementById("f_cc_"+k); if(el) db.settings.campaignCost[k]=Number(el.value||0); });
 if(doClose){ closeModal(); queueSave(); if(currentId) openDetail(currentId); } else { queueSave(); openAdmin(); }
}

window.addEventListener("load",init);
</script>
