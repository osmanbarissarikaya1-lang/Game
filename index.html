<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSMOYUN - Devlet Bilgi Sistemi</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Playfair+Display:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stiller/ana_stil.css">
</head>
<body>

<!-- GİRİŞ FORMU -->
<div id="auth" class="auth">
 <div class="authbox">
  <h1 class="brand" style="font-size:26px; margin:0 0 4px; color:var(--border-gold);">⚔️ OSMOYUN</h1>
  <p class="sub" style="margin:0 0 16px; font-size:13px;">Devlet Bilgi Sistemi</p>
  <div style="display:flex;gap:5px;margin-bottom:12px;"><button id="loginTab" class="btn blue" style="flex:1;">Giriş Yap</button><button id="signupTab" class="btn" style="flex:1;">Kayıt Ol</button></div>
  <label style="text-align:left;">E-posta</label><input id="email" type="email" autocomplete="email">
  <label style="text-align:left; margin-top:8px;">Şifre</label><input id="password" type="password" autocomplete="current-password">
  <button id="authBtn" class="btn green" style="width:100%;margin-top:15px; padding:10px;">Giriş Yap</button>
  <div id="authMsg"></div>
 </div>
</div>

<!-- OYUN PANELİ -->
<div id="app" class="hidden">
<div class="container">
<header class="top">
 <div><div class="brand">⚔️ OSMOYUN • Devlet Bilgi Sistemi</div><div id="syncText" class="sub">Bağlantı kuruluyor...</div></div>
 <div class="actions" id="topActions"></div>
</header>
<div id="home" class="screen">
 <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin:0; font-family:'Oswald'; color:var(--border-gold);">DEVLETLER</h3>
    <button class="btn gold" onclick="openGameMap()">🗺️ HARİTA</button>
 </div>
 <div id="pendingEventsHome"></div><div id="stateGrid" class="cards"></div>
</div>
<div id="detail" class="screen hidden"></div>
<div id="mapScreen" class="screen hidden"></div>
</div></div>

<div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="game-data.js"></script>

<!-- Modüler Oyun Dosyaları -->
<script src="js_modulleri/01_degiskenler_ve_durum.js"></script>
<script src="js_modulleri/02_olaylar_ve_havuz.js"></script>
<script src="js_modulleri/03_veritabani.js"></script>
<script src="js_modulleri/04_ayarlar_ve_yardimcilar.js"></script>
<script src="js_modulleri/05_auth.js"></script>
<script src="js_modulleri/06_zaman.js"></script>
<script src="js_modulleri/07_harita.js"></script>
<script src="js_modulleri/08_arayuz.js"></script>
<script src="js_modulleri/09_askeri_ve_sivil.js"></script>
<script src="js_modulleri/10_diplomasi.js"></script>
<script src="js_modulleri/11_ekonomi.js"></script>
<script src="js_modulleri/12_admin_ve_diger.js"></script>

</body>
</html>
