<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devlet Yönetim Paneli</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:16px}.box{background:#132238;border:1px solid #30435e;border-radius:12px;padding:20px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer}.green{background:#12c98b;color:#06140f}.blue{background:#347ff3;color:#fff}.gray{background:#3b4d68;color:#fff}.red{background:#e54848;color:#fff}.orange{background:#e8a100;color:#171000}.hidden{display:none!important}.muted{color:#9eacc0}.money{color:#12c98b;font-weight:bold;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.state{border:3px solid #347ff3}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.unit{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#22354d;border-radius:7px;padding:12px;margin:7px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form div{display:flex;flex-direction:column;gap:5px}input,select,textarea{padding:11px;background:#0a1728;color:#fff;border:1px solid #43556e;border-radius:7px;width:100%}textarea{min-height:90px;resize:vertical}.modal{position:fixed;inset:0;background:#000b;display:flex;justify-content:center;align-items:center;padding:15px;z-index:20}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:#122035;border-radius:12px;padding:22px}.status{padding:8px 11px;border-radius:7px;background:#22354d;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#1d3048;border-radius:9px;padding:14px}.metric b{display:block;font-size:19px;margin-top:6px}.danger{color:#ff6b6b}.success{color:#12c98b}.warning{color:#ffcc66}.bar{height:9px;background:#31445f;border-radius:10px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:#12c98b}.small{font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#203552;color:#b9c7db;font-size:12px}.log{border-left:3px solid #347ff3;padding:8px 12px;background:#102035;margin:7px 0;border-radius:5px}.sale-admin{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px;background:#1c3049;border-radius:8px;margin:8px 0}@media(max-width:800px){.grid,.form,.cards,.sale-admin,.row{grid-template-columns:1fr}.top{display:block}}
</style>
</head>
<body><div class="wrap">
<section id="auth" class="box"><h1>⚜ DEVLET YÖNETİM</h1><p class="muted">Online kayıtlı sürüm</p><div class="form"><div><label>E-posta</label><input id="email" type="email"></div><div><label>Şifre</label><input id="password" type="password"></div></div><div class="actions" style="margin-top:14px"><button class="green" id="login">GİRİŞ YAP</button><button class="blue" id="signup">HESAP OLUŞTUR</button></div><div id="authMsg" class="status muted"></div></section>
<section id="app" class="hidden"><div class="box top"><div><h2>⚜ DEVLET YÖNETİM PANELİ</h2><div id="user" class="muted"></div><div id="saveStatus" class="status">☁ Hazır</div></div><div class="actions"><button class="green" id="add">＋ Devlet Ekle</button><button class="blue" id="admin">⚙ Admin Paneli</button><button class="gray" id="logout">Çıkış</button></div></div>
<div id="home"><h2>DEVLETLER</h2><div id="states" class="grid"></div></div><div id="detail" class="hidden"></div></section></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="mt"></h2><button class="gray" id="close">×</button></div><div id="mb"></div></div></div>
<script>
const SUPABASE_URL=window.SUPABASE_URL, SUPABASE_KEY=window.SUPABASE_KEY, REST_URL=SUPABASE_URL+"/rest/v1";
const DEFAULT_PR={Piyade:100,Süvari:250,Nişancı:150,"Küçük Top":5000,"Orta Top":12000,"Büyük Top":25000,"Küçük Gemi":50000,"Orta Gemi":150000,"Büyük Gemi":500000,"Küçük Liman":100000,"Orta Liman":200000,"Büyük Liman":350000,"Küçük Top Ocağı":80000,"Orta Top Ocağı":150000,"Büyük Top Ocağı":250000,"Okul":120000};
const DEFAULT_MA={Piyade:100,Süvari:180,Nişancı:130,"Küçük Top":500,"Orta Top":1000,"Büyük Top":2000,"Küçük Gemi":5000,"Orta Gemi":15000,"Büyük Gemi":30000};
const DEFAULT_FAC={port:{small:5,medium:7,large:10},foundry:{small:5,medium:7,large:10}};
const DEFAULT_CFG={baseTaxPerCapita:6,educationTaxBonusMax:0.5,happinessEligibleBonusMax:0.20,schoolEducationGain:2,schoolMax:100};
let db={states:[],prices:{...DEFAULT_PR},maint:{...DEFAULT_MA},facilities:structuredClone(DEFAULT_FAC),rules:{...DEFAULT_CFG},customSales:[]},uid=null,token=null,selected=-1,timer=null;
const $=id=>document.getElementById(id),fmt=x=>(Number(x)||0).toLocaleString("tr-TR"),money=x=>fmt(x)+" TL",esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),key=x=>x.replace(/[^a-zA-Z0-9]/g,"_");
function stat(t){if($("saveStatus"))$("saveStatus").textContent=t} function authHeaders(extra={}){return {apikey:SUPABASE_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json",...extra}}
async function api(path,opt={},auth=true){const h={apikey:SUPABASE_KEY,"Content-Type":"application/json",...(auth?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})};const r=await fetch(SUPABASE_URL+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||d?.error||"HTTP "+r.status);return d}
async function loginUser(){try{$("authMsg").textContent="Giriş yapılıyor...";const d=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})},false);token=d.access_token;uid=d.user.id;localStorage.setItem("game_session",JSON.stringify(d));await enterApp(d.user.email)}catch(e){$("authMsg").textContent="❌ "+e.message}}
async function signupUser(){try{$("authMsg").textContent="Hesap oluşturuluyor...";const d=await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})},false);if(d.access_token){token=d.access_token;uid=d.user.id;localStorage.setItem("game_session",JSON.stringify(d));await enterApp(d.user.email)}else $("authMsg").textContent="Hesap oluşturuldu. E-posta doğrulaması açıksa mailini kontrol et."}catch(e){$("authMsg").textContent="❌ "+e.message}}
async function enterApp(email){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("user").textContent=email||"";try{await load()}catch(e){stat("❌ "+e.message)}}
async function restore(){try{const raw=localStorage.getItem("game_session");if(!raw)return;const s=JSON.parse(raw);if(!s?.access_token||!s?.user?.id)return;token=s.access_token;uid=s.user.id;const u=await api("/auth/v1/user",{},true);await enterApp(u.email)}catch(e){localStorage.removeItem("game_session");token=null;uid=null}}
async function logout(){try{if(token)await api("/auth/v1/logout",{method:"POST"},true)}catch(_){}localStorage.removeItem("game_session");location.reload()}
function normalize(){db.states=Array.isArray(db.states)?db.states:[];db.prices={...DEFAULT_PR,...(db.prices||{})};db.maint={...DEFAULT_MA,...(db.maint||{})};db.facilities={...DEFAULT_FAC,...(db.facilities||{}),port:{...DEFAULT_FAC.port,...(db.facilities?.port||{})},foundry:{...DEFAULT_FAC.foundry,...(db.facilities?.foundry||{})}};db.rules={...DEFAULT_CFG,...(db.rules||{})};db.customSales=Array.isArray(db.customSales)?db.customSales:[];db.states.forEach(s=>{s.logs=Array.isArray(s.logs)?s.logs:[];s.happiness=Number.isFinite(Number(s.happiness))?Number(s.happiness):70;s.education=Number.isFinite(Number(s.education))?Number(s.education):30;s.taxRate=Number.isFinite(Number(s.taxRate))?Number(s.taxRate):20;s.baseEligibleRate=Number.isFinite(Number(s.baseEligibleRate))?Number(s.baseEligibleRate):20;s.ports=s.ports||{small:0,medium:0,large:0};s.foundries=s.foundries||{small:0,medium:0,large:0};s.schools=Number(s.schools)||0;s.vergiGeliri=Number(s.vergiGeliri)||0;s.ticaretGeliri=Number(s.ticaretGeliri)||0;s.digerGelir=Number(s.digerGelir)||0;s.sivilGider=Number(s.sivilGider)||0;s.digerGider=Number(s.digerGider)||0})}
async function load(){const r=await fetch(REST_URL+"/game_data?owner_id=eq."+encodeURIComponent(uid)+"&select=data",{headers:authHeaders()});const d=await r.json();if(!r.ok)throw new Error(d?.message||d?.hint||"Supabase veri okuma hatası");if(d.length)db=d[0].data||db;normalize();if(!d.length)await writeDb(true);render()}
async function writeDb(silent=false){if(!token||!uid)return;if(!silent)stat("☁ Kaydediliyor...");normalize();const r=await fetch(REST_URL+"/game_data?on_conflict=owner_id",{method:"POST",headers:authHeaders({Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({owner_id:uid,data:db,updated_at:new Date().toISOString()})});if(!r.ok){let x={};try{x=await r.json()}catch(_){}throw new Error(x.message||x.hint||"Supabase kayıt hatası")}stat("☁ Online kaydedildi")}
function modal(t,h){$("mt").textContent=t;$("mb").innerHTML=h;$("modal").classList.remove("hidden")}function close(){$("modal").classList.add("hidden")}
function totalArmy(s){return (s.piyade||0)+(s.suvari||0)+(s.nisanci||0)}function totalGuns(s){return (s.kucukTop||0)+(s.ortaTop||0)+(s.buyukTop||0)}function totalShips(s){return (s.kucukGemi||0)+(s.ortaGemi||0)+(s.buyukGemi||0)}
function effectiveRate(s){return Math.min(100,Math.max(0,(Number(s.baseEligibleRate)||0)+(Number(s.happiness||0)/100)*(Number(db.rules.happinessEligibleBonusMax)||0)*100))}
function effectivePop(s){return Math.floor((Number(s.nufus)||0)*effectiveRate(s)/100)}
function taxIncome(s){const base=Number(db.rules.baseTaxPerCapita)||0,edu=1+(Number(s.education)||0)/100*(Number(db.rules.educationTaxBonusMax)||0);return Math.floor((Number(s.nufus)||0)*base*(Number(s.taxRate)||0)/20*edu)}
function portCap(s){return (s.ports.small||0)*db.facilities.port.small+(s.ports.medium||0)*db.facilities.port.medium+(s.ports.large||0)*db.facilities.port.large}function foundryCap(s){return (s.foundries.small||0)*db.facilities.foundry.small+(s.foundries.medium||0)*db.facilities.foundry.medium+(s.foundries.large||0)*db.facilities.foundry.large}
function render(){const a=$("states");a.innerHTML=db.states.length?"":"<div class='box'><h3>Henüz devlet yok.</h3><p class='muted'>＋ Devlet Ekle ile başlayabilirsin.</p></div>";db.states.forEach((s,i)=>{const d=document.createElement("div");d.className="box state";d.style.borderColor=s.renk||"#347ff3";d.innerHTML=`<div class=top><h2>${esc(s.ad)}</h2><span class=pill>${esc(s.hukumdar||"")}</span></div><p class=money>💰 ${money(s.hazine)}</p><div class=row><div>👥 Nüfus<br><b>${fmt(s.nufus)}</b></div><div>⚔ Ordu<br><b>${fmt(totalArmy(s))}</b></div><div>💣 Top<br><b>${fmt(totalGuns(s))}</b></div><div>⚓ Gemi<br><b>${fmt(totalShips(s))}</b></div></div><div class=small muted style='margin-top:10px'>😊 Mutluluk %${s.happiness} · 🎓 Eğitim %${s.education}</div><button class='blue' style='width:100%;margin-top:15px' onclick='detail(${i})'>DETAY / YÖNET</button>`;a.appendChild(d)})}
const fields=[["ad","Devlet adı","text"],["hukumdar","Taht sahibi","text"],["renk","Çerçeve rengi","color"],["hazine","Hazine","number"],["nufus","Toplam nüfus","number"],["baseEligibleRate","Temel elverişli nüfus oranı (%)","number"],["happiness","Halk mutluluğu (%)","number"],["education","Eğitim seviyesi (%)","number"],["taxRate","Vergi oranı (%)","number"],["piyade","Piyade","number"],["suvari","Süvari","number"],["nisanci","Nişancı","number"],["kucukTop","Küçük top","number"],["ortaTop","Orta top","number"],["buyukTop","Büyük top","number"],["kucukGemi","Küçük gemi","number"],["ortaGemi","Orta gemi","number"],["buyukGemi","Büyük gemi","number"],["vergiGeliri","Ek vergi geliri","number"],["ticaretGeliri","Ticaret geliri","number"],["digerGelir","Diğer gelir","number"],["sivilGider","Sivil gider","number"],["digerGider","Diğer gider","number"]];
function stateForm(i=-1){const s=i<0?{}:db.states[i];let h="<div class=form>";fields.forEach(f=>h+=`<div><label>${f[1]}</label><input id=f_${f[0]} type=${f[2]} value='${esc(s[f[0]]??(f[0]=="renk"?"#347ff3":0))}'></div>`);h+=`</div><p class=small muted>Elverişli nüfus artık mutluluk bonusuyla otomatik hesaplanır. Formdaki temel oran başlangıç oranıdır.</p><div class=actions><button class=green onclick='saveState(${i})'>KAYDET</button>${i>=0?`<button class=red onclick='delState(${i})'>SİL</button>`:""}</div>`;modal(i<0?"DEVLET EKLE":"DEVLETİ DÜZENLE",h)}
async function saveState(i){try{const s={};fields.forEach(f=>s[f[0]]=["ad","hukumdar","renk"].includes(f[0])?$("f_"+f[0]).value:Number($("f_"+f[0]).value)||0);if(!s.ad.trim())return alert("Devlet adı gerekli.");if(s.happiness>100||s.education>100||s.taxRate>100||s.baseEligibleRate>100)return alert("Yüzde değerleri 0-100 arasında olmalı.");if(i>=0){s.ports=db.states[i].ports||{small:0,medium:0,large:0};s.foundries=db.states[i].foundries||{small:0,medium:0,large:0};s.schools=db.states[i].schools||0;s.logs=db.states[i].logs||[]}else{s.ports={small:0,medium:0,large:0};s.foundries={small:0,medium:0,large:0};s.schools=0;s.logs=[]}i<0?db.states.push(s):db.states[i]=s;await writeDb();close();render()}catch(e){alert("Kayıt hatası: "+e.message)}}
async function delState(i){if(!confirm(db.states[i].ad+" silinsin mi?"))return;try{db.states.splice(i,1);await writeDb();close();render()}catch(e){alert("Silme hatası: "+e.message)}}
function home(){$("detail").classList.add("hidden");$("home").classList.remove("hidden");render()}function unit(a,b){return `<div class=unit><span>${a}</span><b>${fmt(b)}</b></div>`}
function detail(i){selected=i;const s=db.states[i];$("home").classList.add("hidden");$("detail").classList.remove("hidden");const ac=(s.piyade||0)*db.maint.Piyade+(s.suvari||0)*db.maint.Süvari+(s.nisanci||0)*db.maint.Nişancı,tc=(s.kucukTop||0)*db.maint["Küçük Top"]+(s.ortaTop||0)*db.maint["Orta Top"]+(s.buyukTop||0)*db.maint["Büyük Top"],gc=(s.kucukGemi||0)*db.maint["Küçük Gemi"]+(s.ortaGemi||0)*db.maint["Orta Gemi"]+(s.buyukGemi||0)*db.maint["Büyük Gemi"],ot=(s.sivilGider||0)+(s.digerGider||0),income=taxIncome(s)+Number(s.vergiGeliri||0)+Number(s.ticaretGeliri||0)+Number(s.digerGelir||0),totalG=ac+tc+gc+ot;$("detail").innerHTML=`<div class=box><div class=top><div><h1>${esc(s.ad)}</h1><div class=money>💰 ${money(s.hazine)}</div></div><button class=gray onclick=home()>← Geri</button></div></div><div class=actions><button class=green onclick=buyModal()>🛒 SATIN AL</button><button class=blue onclick=stateForm(${i})>✎ VERİLERİ DÜZENLE</button><button class=blue onclick=transfer()>💸 PARA AKTAR</button><button class=red onclick=expenseModal()>💸 HAZİNEDEN PARA KES</button></div><div class=cards><div class=metric>😊 Halk mutluluğu<b>%${fmt(s.happiness)}</b><div class=bar><i style='width:${s.happiness}%'></i></div></div><div class=metric>🎓 Eğitim<b>%${fmt(s.education)}</b><div class=bar><i style='width:${s.education}%'></i></div></div><div class=metric>👥 Elverişli nüfus<b>${fmt(effectivePop(s))}</b><span class=small muted>Oran %${effectiveRate(s).toFixed(1)}</span></div></div><div class=box><div class=section-title><h3>💰 GELİR DETAYLARI</h3><span class=pill>Yıllık</span></div><p>Vergi (otomatik): <b class=success>${money(taxIncome(s))}</b></p><p>Ek vergi: ${money(s.vergiGeliri)}</p><p>Ticaret: ${money(s.ticaretGeliri)}</p><p>Diğer: ${money(s.digerGelir)}</p><hr><b>TOPLAM GELİR: ${money(income)}</b></div><div class=box><div class=section-title><h3>📉 GİDER DETAYLARI</h3></div><p>⚔ Ordu: ${money(ac)}</p><p>💣 Topçu: ${money(tc)}</p><p>⚓ Donanma: ${money(gc)}</p><p>🏛 Sivil + diğer: ${money(ot)}</p><hr><b>TOPLAM YILLIK BAKIM/GİDER: ${money(totalG)}</b></div><div class=box><h3>🏗 TESİSLER</h3><div class=row><div class=metric>⚓ Liman kapasitesi<b>${fmt(totalShips(s))} / ${fmt(portCap(s))}</b><span class=small muted>Gemi kapasitesi</span></div><div class=metric>💣 Top ocağı kapasitesi<b>${fmt(totalGuns(s))} / ${fmt(foundryCap(s))}</b><span class=small muted>Top kapasitesi</span></div><div class=metric>🏫 Okul<b>${fmt(s.schools)}</b><span class=small muted>+${db.rules.schoolEducationGain} eğitim / okul</span></div></div><p class=small muted>Liman ve top ocağı kapasitesi doluysa yeni ilgili birlik alınamaz.</p></div><div class=box><h3>🪖 BİRLİKLER</h3>${unit("🪖 Piyade",s.piyade)}${unit("🐎 Süvari",s.suvari)}${unit("🏹 Nişancı",s.nisanci)}${unit("💣 Küçük Top",s.kucukTop)}${unit("💣 Orta Top",s.ortaTop)}${unit("💣 Büyük Top",s.buyukTop)}${unit("⚓ Küçük Gemi",s.kucukGemi)}${unit("⚓ Orta Gemi",s.ortaGemi)}${unit("⚓ Büyük Gemi",s.buyukGemi)}</div><div class=box><h3>📜 HAZİNE İŞLEM GEÇMİŞİ</h3>${(s.logs||[]).slice().reverse().slice(0,30).map(l=>`<div class=log><b>${l.type}</b> · ${money(l.amount)}<br><span class=small>${esc(l.note||"")} · ${esc(l.date||"")}</span></div>`).join("")||"<span class=muted>Henüz işlem yok.</span>"}</div>`}
function buyModal(){const s=db.states[selected];let h=`<p>Hazine: <b class=money>${money(s.hazine)}</b> · Elverişli: <b>${fmt(effectivePop(s))}</b> · Gemi kapasitesi: <b>${fmt(totalShips(s))}/${fmt(portCap(s))}</b> · Top kapasitesi: <b>${fmt(totalGuns(s))}/${fmt(foundryCap(s))}</b></p>`;const items=[...Object.keys(db.prices),...db.customSales.map(x=>x.name)];items.forEach(k=>{let price=db.prices[k]??db.customSales.find(x=>x.name===k)?.price??0;let kind=db.customSales.find(x=>x.name===k)?.kind||"genel";h+=`<div class=unit><span>${esc(k)}<small class=muted><br>${money(price)}/adet ${kind!=="genel"?"· "+kind:""}</small></span><input id=b_${key(k)} type=number min=1 placeholder=Adet style='width:90px'><button class=green onclick='buy("${esc(k)}")'>AL</button></div>`});modal("🛒 SATIN AL",h)}
function facilityNeed(k){const s=db.states[selected];if(k==="Küçük Liman")return [s.ports,"small","port",db.facilities.port.small];if(k==="Orta Liman")return [s.ports,"medium","port",db.facilities.port.medium];if(k==="Büyük Liman")return [s.ports,"large","port",db.facilities.port.large];if(k==="Küçük Top Ocağı")return [s.foundries,"small","foundry",db.facilities.foundry.small];if(k==="Orta Top Ocağı")return [s.foundries,"medium","foundry",db.facilities.foundry.medium];if(k==="Büyük Top Ocağı")return [s.foundries,"large","foundry",db.facilities.foundry.large];return null}
async function buy(k){try{const s=db.states[selected],q=Number($("b_"+key(k)).value)||0,price=db.prices[k]??db.customSales.find(x=>x.name===k)?.price??0,c=q*price;if(q<1||s.hazine<c)return alert("Geçersiz adet veya hazine yetersiz.");const human=["Piyade","Süvari","Nişancı"].includes(k);const map={Piyade:"piyade",Süvari:"suvari",Nişancı:"nisanci","Küçük Top":"kucukTop","Orta Top":"ortaTop","Büyük Top":"buyukTop","Küçük Gemi":"kucukGemi","Orta Gemi":"ortaGemi","Büyük Gemi":"buyukGemi"};if(human&&effectivePop(s)<q)return alert("Elverişli nüfus yetersiz.");if(k.includes("Gemi")&&totalShips(s)+q>portCap(s))return alert("Liman kapasitesi yetersiz. Önce liman yapmalısın.");if(k.includes("Top")&&!k.includes("Ocağı")&&totalGuns(s)+q>foundryCap(s))return alert("Top ocağı kapasitesi yetersiz. Önce top ocağı yapmalısın.");if(k==="Okul"){s.schools=(s.schools||0)+q;s.education=Math.min(db.rules.schoolMax,s.education+q*db.rules.schoolEducationGain)}else{const fac=facilityNeed(k);if(fac){fac[0][fac[1]]=(fac[0][fac[1]]||0)+q}else if(map[k]){s[map[k]]=(s[map[k]]||0)+q;if(human)s.elverisli=Math.max(0,effectivePop(s)-q)}}s.hazine-=c;s.logs.push({type:"Satın alma",amount:c,note:`${q} adet ${k}`,date:new Date().toLocaleString("tr-TR")});await writeDb();close();detail(selected)}catch(e){alert("Satın alma hatası: "+e.message)}}
function expenseModal(){modal("💸 HAZİNEDEN PARA KES",`<div><label>Tutar (TL)</label><input id=expenseAmount type=number min=1></div><div style='margin-top:10px'><label>Açıklama</label><textarea id=expenseNote placeholder='Örn: Savaş tazminatı, özel harcama, saray masrafı...'></textarea></div><button class=red style='margin-top:12px' onclick='doExpense()'>KESİNTİYİ UYGULA</button>`)}
async function doExpense(){try{const s=db.states[selected],a=Number($("expenseAmount").value)||0,n=$("expenseNote").value.trim();if(a<=0||a>s.hazine)return alert("Tutar hazineyi aşamaz.");if(!n)return alert("Açıklama yazmalısın.");s.hazine-=a;s.logs.push({type:"Hazine kesintisi",amount:a,note:n,date:new Date().toLocaleString("tr-TR")});await writeDb();close();detail(selected)}catch(e){alert(e.message)}}
function transfer(){let o=db.states.map((s,i)=>i!==selected?`<option value=${i}>${esc(s.ad)}</option>`:"").join("");if(!o)return alert("En az iki devlet gerekli.");modal("💸 PARA AKTAR",`<select id=target>${o}</select><input id=amt type=number placeholder=Tutar style='margin-top:10px'><textarea id=transferNote placeholder='Açıklama (opsiyonel)' style='margin-top:10px'></textarea><button class=green style='margin-top:10px' onclick=doTransfer()>AKTAR</button>`)}
async function doTransfer(){try{let j=Number($("target").value),a=Number($("amt").value)||0,s=db.states[selected],n=$("transferNote").value.trim();if(!db.states[j]||a<=0||a>s.hazine)return alert("Geçersiz tutar veya hazine yetersiz.");s.hazine-=a;db.states[j].hazine+=a;s.logs.push({type:"Para aktarımı",amount:a,note:`${db.states[j].ad} → ${n||"Açıklama yok"}`,date:new Date().toLocaleString("tr-TR")});await writeDb();close();detail(selected)}catch(e){alert("Aktarım hatası: "+e.message)}}
function admin(){let h=`<h3>💰 Fiyatlar</h3><div class=form>`;Object.keys(db.prices).forEach(k=>h+=`<div><label>${esc(k)}</label><input id=p_${key(k)} type=number value=${db.prices[k]}></div>`);h+=`</div><h3>🏗 Kapasiteler / Kurallar</h3><div class=form><div><label>Küçük liman gemi kapasitesi</label><input id=cap_ps type=number value=${db.facilities.port.small}></div><div><label>Orta liman gemi kapasitesi</label><input id=cap_pm type=number value=${db.facilities.port.medium}></div><div><label>Büyük liman gemi kapasitesi</label><input id=cap_pl type=number value=${db.facilities.port.large}></div><div><label>Küçük top ocağı kapasitesi</label><input id=cap_fs type=number value=${db.facilities.foundry.small}></div><div><label>Orta top ocağı kapasitesi</label><input id=cap_fm type=number value=${db.facilities.foundry.medium}></div><div><label>Büyük top ocağı kapasitesi</label><input id=cap_fl type=number value=${db.facilities.foundry.large}></div><div><label>Okul eğitim artışı</label><input id=schoolGain type=number step=.1 value=${db.rules.schoolEducationGain}></div><div><label>Okul eğitim üst sınırı</label><input id=schoolMax type=number value=${db.rules.schoolMax}></div><div><label>Nüfus başı temel vergi</label><input id=baseTax type=number step=.01 value=${db.rules.baseTaxPerCapita}></div><div><label>Eğitim %100'de vergi bonusu</label><input id=eduBonus type=number step=.01 value=${db.rules.educationTaxBonusMax}></div><div><label>Mutluluk bonusu (maks. oran)</label><input id=happyBonus type=number step=.01 value=${db.rules.happinessEligibleBonusMax}></div></div><h3>➕ Yeni satış ürünü</h3><p class=small muted>Özel ürünler de satın alma ekranına eklenir. İstersen tesis, asker, kaynak veya başka bir kalem ekleyebilirsin.</p><div class=sale-admin><input id=newSaleName placeholder=Ürün adı><input id=newSalePrice type=number placeholder=Fiyat><input id=newSaleKind placeholder=Tür (genel/tesis/asker)></div><button class=orange onclick=addSale()>＋ SATIŞ ÜRÜNÜ EKLE</button><div id=customList>${db.customSales.map((x,i)=>`<div class=unit><span>${esc(x.name)} · ${money(x.price)} · ${esc(x.kind||"genel")}</span><button class=red onclick='removeSale(${i})'>SİL</button></div>`).join("")}</div><hr><h3>🛠 Bakım giderleri</h3><div class=form>`;Object.keys(db.maint).forEach(k=>h+=`<div><label>${esc(k)} yıllık bakım</label><input id=m_${key(k)} type=number value=${db.maint[k]}></div>`);h+=`</div><button class=green style='margin-top:15px' onclick=saveAdmin()>KAYDET</button>`;modal("⚙ ADMİN PANELİ",h)}
async function addSale(){const n=$("newSaleName").value.trim(),p=Number($("newSalePrice").value)||0,k=$("newSaleKind").value.trim()||"genel";if(!n||p<=0)return alert("Ürün adı ve fiyat gerekli.");if(db.prices[n]||db.customSales.some(x=>x.name===n))return alert("Bu isim zaten var.");db.customSales.push({name:n,price:p,kind:k});await writeDb();admin()}
async function removeSale(i){if(!confirm("Bu satış ürününü kaldır?"))return;db.customSales.splice(i,1);await writeDb();admin()}
async function saveAdmin(){try{Object.keys(db.prices).forEach(k=>db.prices[k]=Number($("p_"+key(k)).value)||0);Object.keys(db.maint).forEach(k=>db.maint[k]=Number($("m_"+key(k)).value)||0);db.facilities.port.small=Number($("cap_ps").value)||0;db.facilities.port.medium=Number($("cap_pm").value)||0;db.facilities.port.large=Number($("cap_pl").value)||0;db.facilities.foundry.small=Number($("cap_fs").value)||0;db.facilities.foundry.medium=Number($("cap_fm").value)||0;db.facilities.foundry.large=Number($("cap_fl").value)||0;db.rules.schoolEducationGain=Number($("schoolGain").value)||0;db.rules.schoolMax=Number($("schoolMax").value)||100;db.rules.baseTaxPerCapita=Number($("baseTax").value)||0;db.rules.educationTaxBonusMax=Number($("eduBonus").value)||0;db.rules.happinessEligibleBonusMax=Number($("happyBonus").value)||0;await writeDb();close();if(selected>=0)detail(selected)}catch(e){alert("Admin kayıt hatası: "+e.message)}}
$("close").addEventListener("click",close);$("login").addEventListener("click",loginUser);$("signup").addEventListener("click",signupUser);$("add").addEventListener("click",()=>stateForm());$("admin").addEventListener("click",admin);$("logout").addEventListener("click",logout);window.addEventListener("error",e=>{console.error(e);if($("authMsg"))$("authMsg").textContent="❌ JavaScript hatası: "+e.message});if(!SUPABASE_URL||!SUPABASE_KEY)$("authMsg").textContent="❌ Supabase ayarları bulunamadı.";restore();
</script></body></html>
