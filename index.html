<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devlet Yönetim Paneli</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial}.wrap{max-width:1150px;margin:auto;padding:16px}.box{background:#132238;border:1px solid #30435e;border-radius:12px;padding:20px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer}.green{background:#12c98b;color:#06140f}.blue{background:#347ff3;color:#fff}.gray{background:#3b4d68;color:#fff}.red{background:#e54848;color:#fff}.hidden{display:none!important}.muted{color:#9eacc0}.money{color:#12c98b;font-weight:bold;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.state{border:3px solid #347ff3}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.unit{display:flex;justify-content:space-between;background:#22354d;border-radius:7px;padding:12px;margin:7px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form div{display:flex;flex-direction:column;gap:5px}input,select{padding:11px;background:#0a1728;color:#fff;border:1px solid #43556e;border-radius:7px}.modal{position:fixed;inset:0;background:#000b;display:flex;justify-content:center;align-items:center;padding:15px}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#122035;border-radius:12px;padding:22px}.status{padding:8px 11px;border-radius:7px;background:#22354d;margin-top:8px}@media(max-width:700px){.grid,.form,.row{grid-template-columns:1fr}.top{display:block}}</style></head><body><div class="wrap"><section id="auth" class="box"><h1>⚜ DEVLET YÖNETİM</h1><p class="muted">Online kayıtlı sürüm</p><div class="form"><div><label>E-posta</label><input id="email" type="email"></div><div><label>Şifre</label><input id="password" type="password"></div></div><div class="actions" style="margin-top:14px"><button class="green" id="login">GİRİŞ YAP</button><button class="blue" id="signup">HESAP OLUŞTUR</button></div><div id="authMsg" class="status muted"></div></section><section id="app" class="hidden"><div class="box top"><div><h2>⚜ DEVLET YÖNETİM PANELİ</h2><div id="user" class="muted"></div><div id="saveStatus" class="status">☁ Hazır</div></div><div class="actions"><button class="green" id="add">＋ Devlet Ekle</button><button class="blue" id="admin">⚙ Admin</button><button class="gray" id="logout">Çıkış</button></div></div><div id="home"><h2>DEVLETLER</h2><div id="states" class="grid"></div></div><div id="detail" class="hidden"></div></section></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="mt"></h2><button class="gray" id="close">×</button></div><div id="mb"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),PR={Piyade:100,Süvari:250,Nişancı:150,"Küçük Top":5000,"Orta Top":12000,"Büyük Top":25000,"Küçük Gemi":50000,"Orta Gemi":150000,"Büyük Gemi":500000},MA={Piyade:100,Süvari:180,Nişancı:130,"Küçük Top":500,"Orta Top":1000,"Büyük Top":2000,"Küçük Gemi":5000,"Orta Gemi":15000,"Büyük Gemi":30000};let db={states:[],prices:{...PR},maint:{...MA}},uid=null,selected=-1,timer;const $=x=>document.getElementById(x),fmt=x=>(+x||0).toLocaleString("tr-TR"),money=x=>fmt(x)+" TL",esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),key=x=>x.replace(/[^a-zA-Z0-9]/g,"_");function stat(t){$("saveStatus").textContent=t}async function save(){clearTimeout(timer);timer=setTimeout(async()=>{stat("☁ Kaydediliyor...");let r=await sb.from("game_data").upsert({owner_id:uid,data:db,updated_at:new Date().toISOString()},{onConflict:"owner_id"});stat(r.error?"❌ Kayıt hatası":"☁ Online kaydedildi")},150)}async function load(){let r=await sb.from("game_data").select("data").eq("owner_id",uid).maybeSingle();if(r.error)return alert(r.error.message);if(r.data?.data){db=r.data.data;db.states=Array.isArray(db.states)?db.states:[];db.prices={...PR,...(db.prices||{})};db.maint={...MA,...(db.maint||{})}}else await sb.from("game_data").insert({owner_id:uid,data:db});render()}function modal(t,h){$("mt").textContent=t;$("mb").innerHTML=h;$("modal").classList.remove("hidden")}function close(){$("modal").classList.add("hidden")}$('close').onclick=close;function render(){let a=$("states");a.innerHTML=db.states.length?"":"<div class=box><h3>Henüz devlet yok.</h3><p class=muted>＋ Devlet Ekle ile başlayabilirsin.</p></div>";db.states.forEach((s,i)=>{let d=document.createElement("div");d.className="box state";d.style.borderColor=s.renk||"#347ff3";d.innerHTML=`<h2>${esc(s.ad)}</h2><div class=muted>${esc(s.hukumdar||"")}</div><p class=money>💰 ${money(s.hazine)}</p><div class=row><div>👥 Nüfus<br><b>${fmt(s.nufus)}</b></div><div>⚔ Ordu<br><b>${fmt((s.piyade||0)+(s.suvari||0)+(s.nisanci||0))}</b></div><div>💣 Top<br><b>${fmt((s.kucukTop||0)+(s.ortaTop||0)+(s.buyukTop||0))}</b></div><div>⚓ Gemi<br><b>${fmt((s.kucukGemi||0)+(s.ortaGemi||0)+(s.buyukGemi||0))}</b></div></div><button class=blue style="width:100%;margin-top:15px" onclick="detail(${i})">DETAY / YÖNET</button>`;a.appendChild(d)})}const fields=[["ad","Devlet adı","text"],["hukumdar","Taht sahibi","text"],["renk","Çerçeve rengi","color"],["hazine","Hazine","number"],["nufus","Toplam nüfus","number"],["elverisli","Elverişli nüfus","number"],["piyade","Piyade","number"],["suvari","Süvari","number"],["nisanci","Nişancı","number"],["kucukTop","Küçük top","number"],["ortaTop","Orta top","number"],["buyukTop","Büyük top","number"],["kucukGemi","Küçük gemi","number"],["ortaGemi","Orta gemi","number"],["buyukGemi","Büyük gemi","number"],["vergiGeliri","Vergi geliri","number"],["ticaretGeliri","Ticaret geliri","number"],["digerGelir","Diğer gelir","number"],["sivilGider","Sivil gider","number"],["digerGider","Diğer gider","number"]];function stateForm(i=-1){let s=i<0?{}:db.states[i],h='<div class=form>';fields.forEach(f=>h+=`<div><label>${f[1]}</label><input id=f_${f[0]} type=${f[2]} value="${esc(s[f[0]]??(f[0]=='renk'?'#347ff3':0))}"></div>`);h+=`</div><div class=actions style="margin-top:15px"><button class=green onclick="saveState(${i})">KAYDET</button>${i>=0?`<button class=red onclick="delState(${i})">SİL</button>`:""}</div>`;modal(i<0?"DEVLET EKLE":"DEVLETİ DÜZENLE",h)}async function saveState(i){let s={};fields.forEach(f=>s[f[0]]=["ad","hukumdar","renk"].includes(f[0])?$("f_"+f[0]).value:Number($("f_"+f[0]).value)||0);if(!s.ad.trim())return alert("Devlet adı gerekli.");if(s.elverisli>s.nufus)return alert("Elverişli nüfus toplam nüfustan büyük olamaz.");i<0?db.states.push(s):db.states[i]=s;await save();close();render()}async function delState(i){if(confirm(db.states[i].ad+" silinsin mi?")){db.states.splice(i,1);await save();close();render()}}function home(){$("detail").classList.add("hidden");$("home").classList.remove("hidden");render()}function unit(a,b){return `<div class=unit><span>${a}</span><b>${fmt(b)}</b></div>`}function detail(i){selected=i;let s=db.states[i];$("home").classList.add("hidden");$("detail").classList.remove("hidden");let ac=(s.piyade||0)*db.maint.Piyade+(s.suvari||0)*db.maint.Süvari+(s.nisanci||0)*db.maint.Nişancı,tc=(s.kucukTop||0)*db.maint["Küçük Top"]+(s.ortaTop||0)*db.maint["Orta Top"]+(s.buyukTop||0)*db.maint["Büyük Top"],gc=(s.kucukGemi||0)*db.maint["Küçük Gemi"]+(s.ortaGemi||0)*db.maint["Orta Gemi"]+(s.buyukGemi||0)*db.maint["Büyük Gemi"],ot=(s.sivilGider||0)+(s.digerGider||0);$("detail").innerHTML=`<div class=box><div class=top><div><h1>${esc(s.ad)}</h1><div class=money>💰 ${money(s.hazine)}</div></div><button class=gray onclick=home()>← Geri</button></div></div><div class=actions><button class=green onclick=buyModal()>🛒 SATIN AL</button><button class=blue onclick=stateForm(${i})>✎ VERİLERİ DÜZENLE</button><button class=blue onclick=transfer()>💸 PARA AKTAR</button></div><div class=box><h3>📉 GİDER DETAYLARI</h3><p>⚔ Ordu: ${money(ac)}</p><p>💣 Topçu: ${money(tc)}</p><p>⚓ Donanma: ${money(gc)}</p><p>🏛 Sivil + diğer: ${money(ot)}</p><hr><b>TOPLAM: ${money(ac+tc+gc+ot)}</b></div><div class=box><h3>🪖 BİRLİKLER</h3>${unit("🪖 Piyade",s.piyade)}${unit("🐎 Süvari",s.suvari)}${unit("🏹 Nişancı",s.nisanci)}${unit("💣 Küçük Top",s.kucukTop)}${unit("💣 Orta Top",s.ortaTop)}${unit("💣 Büyük Top",s.buyukTop)}${unit("⚓ Küçük Gemi",s.kucukGemi)}${unit("⚓ Orta Gemi",s.ortaGemi)}${unit("⚓ Büyük Gemi",s.buyukGemi)}</div>`}function buyModal(){let s=db.states[selected],h=`<p>Hazine: <b class=money>${money(s.hazine)}</b> | Elverişli: <b>${fmt(s.elverisli)}</b></p>`;Object.keys(db.prices).forEach(k=>h+=`<div class=unit><span>${k}<small class=muted><br>${money(db.prices[k])}/adet</small></span><input id=b_${key(k)} type=number min=1 placeholder=Adet style="width:90px"><button class=green onclick="buy('${k}')">AL</button></div>`);modal("🛒 SATIN AL",h)}async function buy(k){let s=db.states[selected],q=Number($("b_"+key(k)).value)||0,c=q*db.prices[k],human=["Piyade","Süvari","Nişancı"].includes(k),map={Piyade:"piyade",Süvari:"suvari",Nişancı:"nisanci","Küçük Top":"kucukTop","Orta Top":"ortaTop","Büyük Top":"buyukTop","Küçük Gemi":"kucukGemi","Orta Gemi":"ortaGemi","Büyük Gemi":"buyukGemi"};if(q<1||s.hazine<c||(human&&s.elverisli<q))return alert("Hazine veya elverişli nüfus yetersiz.");s[map[k]]=(s[map[k]]||0)+q;s.hazine-=c;if(human)s.elverisli-=q;await save();close();detail(selected)}function transfer(){let o=db.states.map((s,i)=>i!==selected?`<option value=${i}>${esc(s.ad)}</option>`:"").join("");if(!o)return alert("En az iki devlet gerekli.");modal("💸 PARA AKTAR",`<select id=target>${o}</select><input id=amt type=number placeholder=Tutar style="margin-top:10px"><button class=green style="margin-top:10px" onclick=doTransfer()>AKTAR</button>`)}async function doTransfer(){let j=Number($("target").value),a=Number($("amt").value)||0,s=db.states[selected];if(!db.states[j]||a<=0||a>s.hazine)return alert("Geçersiz tutar veya hazine yetersiz.");s.hazine-=a;db.states[j].hazine+=a;await save();close();detail(selected)}function admin(){let h='<div class=form>';Object.keys(db.prices).forEach(k=>h+=`<div><label>${k} satın alma fiyatı</label><input id=p_${key(k)} type=number value=${db.prices[k]}></div>`);Object.keys(db.maint).forEach(k=>h+=`<div><label>${k} yıllık bakım gideri</label><input id=m_${key(k)} type=number value=${db.maint[k]}></div>`);h+='</div><button class=green style="margin-top:15px" onclick=saveAdmin()>KAYDET</button>';modal("⚙ ADMİN PANELİ",h)}async function saveAdmin(){Object.keys(db.prices).forEach(k=>db.prices[k]=Number($("p_"+key(k)).value)||0);Object.keys(db.maint).forEach(k=>db.maint[k]=Number($("m_"+key(k)).value)||0);await save();close();if(selected>=0)detail(selected)}$("login").onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)$("authMsg").textContent=r.error.message)};$("signup").onclick=async()=>{let r=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value});$("authMsg").textContent=r.error?r.error.message:"Hesap oluşturuldu. E-posta doğrulaması açıksa mailini kontrol et."};$("add").onclick=()=>stateForm();$("admin").onclick=admin;$("logout").onclick=()=>sb.auth.signOut();async function start(){let r=await sb.auth.getSession();if(r.data.session){uid=r.data.session.user.id;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("user").textContent=r.data.session.user.email;await load()}}sb.auth.onAuthStateChange(e=>{if(e==="SIGNED_OUT")location.reload()});start();</script></body></html>
